<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>核心工作流示意图</title>
<style>
  :root {
    --bg: #f5f6fa;
    --card: #ffffff;
    --border: #e5e7eb;
    --text: #1f2937;
    --text-2: #6b7280;
    --text-3: #9ca3af;
    --accent: #1a237e;

    --s1: #3b82f6;
    --s2: #8b5cf6;
    --s3: #ec4899;
    --s4: #10b981;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, "Helvetica Neue", sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px 60px;
  }

  .wrapper {
    max-width: 1080px;
    width: 100%;
  }

  /* ── Title ── */
  .title {
    text-align: center;
    margin-bottom: 50px;
  }
  .title h2 {
    font-size: 20px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 1px;
  }
  .title p {
    font-size: 12px;
    color: var(--text-3);
    margin-top: 6px;
  }

  /* ── Flow ── */
  .flow {
    display: flex;
    align-items: stretch;
    gap: 0;
  }

  /* ── Step ── */
  .step {
    flex: 1;
    max-width: 220px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.05);
    padding: 24px 16px 20px;
    text-align: center;
    position: relative;
  }
  .step::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    border-radius: 12px 12px 0 0;
  }
  .step.st1::before { background: var(--s1); }
  .step.st2::before { background: var(--s2); }
  .step.st3::before { background: var(--s3); }
  .step.st4::before { background: var(--s4); }

  .step-num {
    width: 26px; height: 26px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 800; color: #fff;
    margin: 0 auto 12px;
  }
  .step.st1 .step-num { background: var(--s1); }
  .step.st2 .step-num { background: var(--s2); }
  .step.st3 .step-num { background: var(--s3); }
  .step.st4 .step-num { background: var(--s4); }

  .step-icon {
    width: 36px; height: 36px;
    margin: 0 auto 12px;
  }
  .step-icon path,
  .step-icon circle,
  .step-icon rect,
  .step-icon line,
  .step-icon polyline {
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .step.st1 .step-icon path,
  .step.st1 .step-icon circle,
  .step.st1 .step-icon line { stroke: var(--s1); }
  .step.st2 .step-icon path,
  .step.st2 .step-icon circle,
  .step.st2 .step-icon rect,
  .step.st2 .step-icon line { stroke: var(--s2); }
  .step.st3 .step-icon path,
  .step.st3 .step-icon circle,
  .step.st3 .step-icon rect,
  .step.st3 .step-icon line,
  .step.st3 .step-icon polyline { stroke: var(--s3); }
  .step.st3 .step-icon .eye { fill: var(--s3); }
  .step.st4 .step-icon path,
  .step.st4 .step-icon rect,
  .step.st4 .step-icon line { stroke: var(--s4); }
  .step.st4 .step-icon .fill { fill: var(--s4); }

  .step-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 6px;
  }
  .step-desc {
    font-size: 10.5px;
    color: var(--text-2);
    line-height: 1.5;
  }

  /* ── Arrow ── */
  .arrow {
    flex-shrink: 0;
    width: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .arrow svg {
    width: 48px;
    height: 24px;
  }
  .arrow .a-line {
    stroke-width: 2.5;
    stroke-linecap: round;
  }
  .arrow .a-head {
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
  }
  .arrow.ar1 .a-line { stroke: linear-gradient(90deg, var(--s1), var(--s2)); }
  .arrow.ar2 .a-line { stroke: linear-gradient(90deg, var(--s2), var(--s3)); }
  .arrow.ar3 .a-line { stroke: linear-gradient(90deg, var(--s3), var(--s4)); }

  /* gradient for arrow line using defs */

  /* ── Loop arrow ── */
  .loop {
    margin-top: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .loop svg {
    width: 36px;
    height: 36px;
  }
  .loop svg path {
    fill: none;
    stroke: var(--accent);
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .loop svg polyline {
    fill: none;
    stroke: var(--accent);
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .loop-text {
    font-size: 12px;
    color: var(--accent);
    font-weight: 700;
    letter-spacing: 1px;
  }

  @media (max-width: 768px) {
    .flow {
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .step { max-width: 100%; width: 100%; }
    .arrow {
      width: auto;
      height: 30px;
    }
    .arrow svg {
      transform: rotate(90deg);
      width: 30px;
      height: 30px;
    }
  }
</style>
</head>
<body>

<div class="wrapper">

  <!-- Title -->
  <div class="title">
    <h2>核心工作流</h2>
    <p>Intelligence Web — 情报采集 → 结构化存储 → AI 分析 → 行动闭环</p>
  </div>

  <!-- SVG defs for arrow gradients -->
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <linearGradient id="g12" x1="0%" x2="100%">
        <stop offset="0%" stop-color="#3b82f6"/>
        <stop offset="100%" stop-color="#8b5cf6"/>
      </linearGradient>
      <linearGradient id="g23" x1="0%" x2="100%">
        <stop offset="0%" stop-color="#8b5cf6"/>
        <stop offset="100%" stop-color="#ec4899"/>
      </linearGradient>
      <linearGradient id="g34" x1="0%" x2="100%">
        <stop offset="0%" stop-color="#ec4899"/>
        <stop offset="100%" stop-color="#10b981"/>
      </linearGradient>
    </defs>
  </svg>

  <!-- Flow -->
  <div class="flow">

    <!-- Step 1 -->
    <div class="step st1">
      <div class="step-num">01</div>
      <svg class="step-icon" viewBox="0 0 48 48">
        <circle cx="21" cy="21" r="13"/>
        <line x1="30" y1="30" x2="40" y2="40"/>
        <line x1="14" y1="21" x2="28" y2="21"/>
        <line x1="21" y1="14" x2="21" y2="28"/>
      </svg>
      <div class="step-title">情报采集</div>
      <div class="step-desc">多渠道自动爬取<br/>增量同步<br/>批量导入</div>
    </div>

    <!-- Arrow 1 -->
    <div class="arrow ar1">
      <svg viewBox="0 0 48 24">
        <line class="a-line" x1="2" y1="12" x2="38" y2="12" stroke="url(#g12)"/>
        <polyline class="a-head" points="32,6 40,12 32,18" stroke="url(#g12)"/>
      </svg>
    </div>

    <!-- Step 2 -->
    <div class="step st2">
      <div class="step-num">02</div>
      <svg class="step-icon" viewBox="0 0 48 48">
        <rect x="7" y="7" width="34" height="34" rx="3"/>
        <line x1="7" y1="19" x2="41" y2="19"/>
        <line x1="7" y1="31" x2="41" y2="31"/>
        <circle cx="14" cy="13" r="1.8" fill="#8b5cf6"/>
        <circle cx="14" cy="25" r="1.8" fill="#8b5cf6"/>
        <circle cx="14" cy="37" r="1.8" fill="#8b5cf6"/>
      </svg>
      <div class="step-title">结构化存储</div>
      <div class="step-desc">自动分类标签化<br/>多维度检索<br/>历史可追溯</div>
    </div>

    <!-- Arrow 2 -->
    <div class="arrow ar2">
      <svg viewBox="0 0 48 24">
        <line class="a-line" x1="2" y1="12" x2="38" y2="12" stroke="url(#g23)"/>
        <polyline class="a-head" points="32,6 40,12 32,18" stroke="url(#g23)"/>
      </svg>
    </div>

    <!-- Step 3 -->
    <div class="step st3">
      <div class="step-num">03</div>
      <svg class="step-icon" viewBox="0 0 48 48">
        <rect x="11" y="14" width="26" height="22" rx="5"/>
        <line x1="24" y1="6" x2="24" y2="14"/>
        <circle cx="18" cy="22" r="2.5" class="eye"/>
        <circle cx="30" cy="22" r="2.5" class="eye"/>
        <polyline points="17,30 20,33 28,33 31,30"/>
        <line x1="6" y1="22" x2="11" y2="22"/>
        <line x1="37" y1="22" x2="42" y2="22"/>
      </svg>
      <div class="step-title">AI 分析</div>
      <div class="step-desc">智能摘要生成<br/>风险提示<br/>MCP 开放集成</div>
    </div>

    <!-- Arrow 3 -->
    <div class="arrow ar3">
      <svg viewBox="0 0 48 24">
        <line class="a-line" x1="2" y1="12" x2="38" y2="12" stroke="url(#g34)"/>
        <polyline class="a-head" points="32,6 40,12 32,18" stroke="url(#g34)"/>
      </svg>
    </div>

    <!-- Step 4 -->
    <div class="step st4">
      <div class="step-num">04</div>
      <svg class="step-icon" viewBox="0 0 48 48">
        <path class="fill" d="M14 8 h20 v8 a10 10 0 0 1 -20 0 z"/>
        <path d="M14 12 h-6 v4 a6 6 0 0 0 6 6"/>
        <path d="M34 12 h6 v4 a6 6 0 0 1 -6 6"/>
        <line x1="24" y1="28" x2="24" y2="36"/>
        <line x1="18" y1="36" x2="30" y2="36"/>
        <rect class="fill" x="14" y="40" width="20" height="4" rx="1"/>
      </svg>
      <div class="step-title">行动闭环</div>
      <div class="step-desc">商机跟进<br/>自动预警<br/>决策支持</div>
    </div>

  </div>

  <!-- Loop indicator -->
  <div class="loop">
    <svg viewBox="0 0 36 36">
      <path d="M6 18 a12 12 0 0 1 20 -8.5"/>
      <polyline points="22,5 26,11 19,11"/>
      <path d="M30 18 a12 12 0 0 1 -20 8.5"/>
      <polyline points="14,31 10,25 17,25"/>
    </svg>
    <span class="loop-text">正向反馈飞轮</span>
  </div>

</div>

</body>
</html>
