server {
    listen 80;
    server_name intelligence.nat.ywapi.com;
    resolver 127.0.0.11 ipv6=off valid=10s;

    root /var/www;
    index index.html;

    # Auth backend (internal)
    location = /_auth {
        internal;
        proxy_pass http://research:8766/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
    }

    # Auth endpoints (public)
    location ~ ^/api/auth/(login|check)$ {
        proxy_pass http://research:8766;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Health endpoint (public)
    location = /api/health {
        proxy_pass http://research:8766;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Favicon (public)
    location = /favicon.ico {
        add_header Content-Type "image/png";
        add_header Cache-Control "public, max-age=31536000";
    }

    # Login page (public - NO auth required)
    location = /portal/login.html {
        root /var/www;
    }

    # Protected API (Research)
    location /api/ {
        auth_request /_auth;
        error_page 401 = @api_auth_fail;
        proxy_pass http://research:8766;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        client_max_body_size 50m;
        proxy_request_buffering off;
    }

    # Sales API via gateway
    location /sales/api/ {
        auth_request /_auth;
        error_page 401 = @api_auth_fail;
        rewrite ^/sales/api/(.*)$ /api/$1 break;
        proxy_pass http://sales:8767;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        client_max_body_size 50m;
        proxy_request_buffering off;
    }

    # Crawler Service API (public - no auth needed)
    location /crawler/api/ {
        rewrite ^/crawler/api/(.*)$ /api/$1 break;
        proxy_pass http://crawler:8768;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API auth failure -> JSON 401
    location @api_auth_fail {
        add_header Content-Type application/json;
        return 401 '{"error":"未登录或登录已过期，请重新登录"}';
    }

    # Research domain (protected)
    location /research/ {
        auth_request /_auth;
        error_page 401 = @api_auth_fail;
        proxy_pass http://research:8766/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    # Sales domain (protected)
    location /sales/ {
        auth_request /_auth;
        error_page 401 = @api_auth_fail;
        proxy_pass http://sales:8767/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    # Root: redirect to shell.html with proper host and port
    location = / {
        set $redirect_url /portal/shell.html;
        return 302 $redirect_url;
    }

    # Portal pages (auth checked by JS, NOT by nginx)
    location /portal/ {
        alias /var/www/portal/;
        index shell.html;
        try_files $uri $uri/ /portal/shell.html;
    }

    # Sales static files (public)
    location /intelligence_sales/ { alias /var/www/intelligence_sales/; }
}