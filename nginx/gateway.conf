# nginx gateway — HTTP (:80, via frp http vhost) + HTTPS (:443, via frp tcp
# tunnel on remote port 8443). Routing lives in locations.inc (shared include).
# TLS cert: Let's Encrypt HTTP-01 issued by ~/.acme.sh, renewed into
# ./nginx/certs/ (git-ignored) with an nginx reload hook.

server {
    listen 80;
    server_name intelligence.nat.ywapi.com;
    include /etc/nginx/locations.inc;
}

server {
    listen 443 ssl;
    http2 on;
    server_name intelligence.nat.ywapi.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    include /etc/nginx/locations.inc;
}
