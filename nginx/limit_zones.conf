# http-layer limit zone definitions.
#
# limit_req_zone is only valid in the http context; gateway.conf is a
# server block (mounted at /etc/nginx/conf.d/default.conf), so the zone is
# defined in this separate conf.d file (mounted at
# /etc/nginx/conf.d/limit_zones.conf — see docker-compose.yml).
#
# Scope: public share pages /s/<32-hex-token> only. /api/, /portal/ and
# every other route are NOT rate-limited.
# (nginx rate units are only r/s and r/m — "10r/min" in the issue maps to 10r/m)
limit_req_zone $binary_remote_addr zone=share:10m rate=10r/m;
