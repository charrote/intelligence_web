<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>情报管理系统</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; min-height: 100vh; }
        .container { max-width: 1400px; margin: 0 auto; padding: 16px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
        .header h1 { font-size: 20px; color: #333; }
        .header .btn-command { padding: 8px 16px; background: #722ed1; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; min-height: 44px; }
        .header .btn-command:hover { background: #531dab; }
        .header span.api-info { display: none; }

        .command-list { list-style: none; }
        .command-list li { padding: 12px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 10px; cursor: grab; }
        .command-list li:last-child { border-bottom: none; }
        .command-list li.dragging { opacity: 0.5; background: #f0f0f0; }
        .command-list .cmd-index { width: 24px; height: 24px; background: #722ed1; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; cursor: grab; }
        .command-list .cmd-text { flex: 1; }
        .command-list .cmd-delete { background: none; border: none; color: #f5222d; cursor: pointer; font-size: 18px; }
        .add-command { margin-top: 15px; }
        .add-command textarea { width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; resize: vertical; min-height: 60px; }
        .add-command button { margin-top: 10px; padding: 8px 16px; background: #722ed1; color: white; border: none; border-radius: 4px; cursor: pointer; }
        
        .filters { background: white; padding: 16px; border-radius: 8px; margin-bottom: 16px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .filters input, .filters select { padding: 10px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; min-height: 44px; }
        .filters input[type="text"] { width: 180px; flex: 1; min-width: 140px; }
        .filters button { padding: 10px 20px; background: #1890ff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; min-height: 44px; }
        .filters button:hover { background: #40a9ff; }
        
        .list { background: white; border-radius: 8px; overflow: hidden; }
        .list-header { display: grid; grid-template-columns: 50px 1fr auto auto auto auto; gap: 10px; padding: 12px 16px; background: #fafafa; font-weight: 600; border-bottom: 1px solid #eee; font-size: 13px; }
        .list-item { display: grid; grid-template-columns: 50px 1fr auto auto auto auto; gap: 10px; padding: 14px 16px; border-bottom: 1px solid #eee; align-items: center; cursor: pointer; transition: background 0.2s; }
        .list-item:hover { background: #f9f9f9; }
        .list-item:last-child { border-bottom: none; }
        .list-item .item-title { word-break: break-word; line-height: 1.4; font-size: 14px; }
        .list-item .item-title.read { color: #999; font-size: 13px; }
        .list-item .item-status { white-space: nowrap; }
        .list-item .item-category { white-space: nowrap; font-size: 12px; }
        .list-item .item-date { white-space: nowrap; font-size: 12px; }
        .list-item .item-comments { white-space: nowrap; font-size: 12px; color: #666; display: flex; align-items: center; gap: 4px; }
        
        .status { padding: 4px 8px; border-radius: 4px; font-size: 12px; text-align: center; }
        .status.pending { background: #fff7e6; color: #fa8c16; }
        .status.approved { background: #f6ffed; color: #52c41a; }
        .status.rejected { background: #fff1f0; color: #f5222d; }
        .status.active { background: #e6f7ff; color: #1890ff; }
        .status.completed { background: #f9f0ff; color: #722ed1; }
        .status.discarded { background: #f5f5f5; color: #999; text-decoration: line-through; }
        
        /* 评论样式 */
        .comments-section { margin-top: 15px; }
        .comments-section h3 { font-size: 14px; color: #666; margin-bottom: 8px; }
        .comment-item { padding: 10px 12px; border-left: 3px solid #722ed1; background: #fafafa; border-radius: 0 4px 4px 0; margin-bottom: 8px; }
        .comment-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .comment-agent { font-weight: 600; color: #722ed1; font-size: 13px; }
        .comment-time { font-size: 11px; color: #999; }
        .comment-content { font-size: 13px; color: #333; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
        .comments-scroll { max-height: 300px; overflow-y: auto; padding-right: 4px; }
        
        /* 详情页总结样式 */
        .detail-summary {
            background: linear-gradient(135deg, #722ed1 0%, #531dab 100%);
            color: white;
            border-radius: 8px;
            padding: 16px;
            margin-top: 20px;
        }
        .detail-summary-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .detail-summary-title {
            font-size: 14px;
            font-weight: 600;
        }
        .detail-summary-time {
            font-size: 11px;
            opacity: 0.7;
        }
        .detail-summary-content {
            font-size: 13px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .detail-summary-empty {
            font-size: 12px;
            opacity: 0.7;
            text-align: center;
            padding: 8px 0;
        }
        
        .category { color: #666; font-size: 13px; }
        .date { color: #999; font-size: 13px; }
        
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; backdrop-filter: blur(2px); }
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; width: 90vw; max-width: 720px; max-height: 85vh; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); z-index: 1001; overflow: hidden; flex-direction: column; }
        .modal.show { display: flex; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid #eee; flex-shrink: 0; position: sticky; top: 0; background: white; z-index: 1; }
        .modal-header h2 { font-size: 17px; margin: 0; }
        .modal-close { background: none; border: none; font-size: 28px; cursor: pointer; color: #999; padding: 0 8px; min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center; }
        .modal-body { padding: 20px; overflow-y: auto; flex: 1; }
        .modal-footer { padding: 12px 20px; border-top: 1px solid #eee; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; flex-shrink: 0; background: #fafafa; position: sticky; bottom: 0; z-index: 1; }
        
        .modal-footer button { padding: 10px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; min-height: 44px; }
        .modal-footer .btn-approve { background: #52c41a; color: white; }
        .modal-footer .btn-reject { background: #f5222d; color: white; }
        .modal-footer .btn-active { background: #1890ff; color: white; }
        .modal-footer .btn-complete { background: #722ed1; color: white; }
        
        .content-preview { white-space: pre-wrap; word-break: break-word; max-height: 100px; overflow: hidden; position: relative; }
        


        /* Markdown body — detail modal content */
        .markdown-body {
            color: rgba(0, 0, 0, 0.85);
            font-size: 16px;
            line-height: 2;
            word-wrap: break-word;
        }

        /* Detail section — softer heading */
        .detail-section {
            margin-bottom: 32px;   /* more space between sections */
        }

        .markdown-body h1, .markdown-body h2 {
            font-size: 20px;
            margin-top: 36px;
            margin-bottom: 20px;
            color: rgba(0, 0, 0, 0.9);
        }

        .markdown-body h1 { border-left: 4px solid #722ed1; padding-left: 12px; } /* indent */
        .markdown-body h3 {
            font-size: 18px;
            margin-top: 30px;
            margin-bottom: 16px;
            color: rgba(45, 45, 79, 0.8);
        }

        /* Paragraphs — more breathing room */
        .markdown-body p {
            margin-bottom: 20px;   /* wider gap between paragraphs */
            text-align: justify;
        }

        /* Lists with indent and spacing */
        .markdown-body ul,
        .markdown-body ol {
            padding-left: 36px;    /* clear left margin for readability */
            margin-bottom: 24px;
        }

        .markdown-body li {
            color: rgba(0, 0, 0, 0.78);
            line-height: 1.95;
            padding-left: 6px;     /* slight indent from bullet */
        }

        /* Blockquote with left border and spacing */
        .markdown-body blockquote {
            margin-bottom: 24px;
            color: rgba(80, 71, 95, 0.8);
            padding-left: 36px;    /* indent from container edge */
            border-left-width: 3px;
        }

        .markdown-body blockquote p {
            margin-bottom: 4px;
        }
        .detail-section h3 { font-size: 14px; color: #666; margin-bottom: 8px; }

        

        

        
        .opinion-input { margin-top: 10px; }
        .opinion-input input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        
        @media (max-width: 768px) {
            .container { padding: 12px; }
            .header h1 { font-size: 18px; }
            .filters { gap: 8px; padding: 12px; }
            .filters input[type="text"] { width: 100%; min-width: unset; }
            .list-header { display: none; }
            .list-item {
                grid-template-columns: 1fr;
                gap: 6px;
                padding: 14px 12px;
            }
            .list-item > span:first-child {
                display: none;
            }
            .list-item .item-title {
                font-size: 15px;
                font-weight: 500;
            }
            .list-item > span:nth-child(3),
            .list-item > span:nth-child(4),
            .list-item > span:nth-child(5),
            .list-item > span:nth-child(6) {
                font-size: 12px;
            }
            .modal { width: 95vw; max-width: 95vw; max-height: 90vh; border-radius: 8px; top: 50%; left: 50%; transform: translate(-50%, -50%); }
            .modal-header h2 { font-size: 16px; }
            .modal-body { padding: 12px; }
            .modal-footer { padding: 10px 12px; }
            .modal-footer button { flex: 1; min-width: 0; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>情报管理系统</h1>
            <div style="display: flex; align-items: center; gap: 15px;">
                <button class="btn-command" onclick="openCommand()">情报指挥</button>
                <span style="color: #999;">Agent API: POST /api/intelligence</span>
            </div>
        </div>
        
        <div class="filters">
            <input type="text" id="searchInput" placeholder="搜索标题或内容...">
            <select id="statusFilter">
                <option value="">全部状态</option>
                <option value="pending">待审阅</option>
                <option value="approved">建议跟进</option>
                <option value="rejected">不建议</option>
                <option value="active">激活</option>
                <option value="completed">已完结</option>
                <option value="discarded">已废弃</option>
            </select>
            <select id="categoryFilter">
                <option value="">全部分类</option>
            </select>
            <input type="date" id="dateFrom" placeholder="开始日期">
            <input type="date" id="dateTo" placeholder="结束日期">
            <button onclick="loadData()">筛选</button>
        </div>
        
        <div class="list">
            <div class="list-header">
                <span>ID</span>
                <span>标题</span>
                <span>状态</span>
                <span>类别</span>
                <span>时间</span>
                <span>评论</span>
            </div>
            <div id="listBody"></div>
        </div>
    </div>
    
    <div class="modal-overlay" id="modalOverlay"></div>
    <div class="modal" id="commandModal">
        <div class="modal-header">
            <h2>情报指挥板</h2>
            <button class="modal-close" onclick="closeCommand()">&times;</button>
        </div>
        <div class="modal-body" id="commandBody"></div>
        <div class="modal-footer">
            <button onclick="saveCommand()" style="padding: 8px 16px; background: #722ed1; color: white; border: none; border-radius: 4px; cursor: pointer;">保存并生成指令文件</button>
        </div>
    </div>
    <div class="modal" id="detailModal">
        <div class="modal-header">
            <h2 id="modalTitle">情报详情</h2>
            <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer" id="modalFooter"></div>
    </div>



    <script>
        // 自动检测 API 地址：如果当前页面通过 IP 访问，API 也用同一 IP
        (function() {
            const host = window.location.hostname;
            if (host === 'localhost' || host === '127.0.0.1') {
                window.API_BASE = 'http://localhost:8766';
            } else {
                window.API_BASE = `http://${host}:8766`;
            }
        })();
        let currentIntel = null;
        let commands = [];
        
        const statusMap = {
            pending: '待审阅',
            approved: '建议跟进',
            rejected: '不建议',
            active: '激活',
            completed: '已完结',
            discarded: '已废弃'
        };
        
        async function loadData() {
            const params = new URLSearchParams();
            const search = document.getElementById('searchInput').value;
            const status = document.getElementById('statusFilter').value;
            const category = document.getElementById('categoryFilter').value;
            const dateFrom = document.getElementById('dateFrom').value;
            const dateTo = document.getElementById('dateTo').value;
            
            if (search) params.append('search', search);
            if (status) params.append('status', status);
            if (category) params.append('category', category);
            if (dateFrom) params.append('date_from', dateFrom);
            if (dateTo) params.append('date_to', dateTo);
            
            const res = await fetch(`${API_BASE}/api/intelligence?${params}`);
            const data = await res.json();
            renderList(data);
        }
        
        async function loadCategories() {
            const res = await fetch(`${API_BASE}/api/categories`);
            const cats = await res.json();
            const select = document.getElementById('categoryFilter');
            cats.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                select.appendChild(opt);
            });
        }
        
        function formatDateTime(isoStr) {
            if (!isoStr) return '-';
            const d = new Date(isoStr);
            if (isNaN(d)) return isoStr;
            const pad = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

        // ========== 已读状态管理 (localStorage) ==========
        const READ_STORAGE_KEY = 'intel_read_ids';
        function getReadIds() {
            try {
                return new Set(JSON.parse(localStorage.getItem(READ_STORAGE_KEY) || '[]'));
            } catch { return new Set(); }
        }
        function markAsRead(id) {
            const ids = getReadIds();
            ids.add(id);
            localStorage.setItem(READ_STORAGE_KEY, JSON.stringify([...ids]));
        }
        function isRead(id) {
            return getReadIds().has(id);
        }
        
        function renderList(items) {
            const body = document.getElementById('listBody');
            if (items.length === 0) {
                body.innerHTML = '<div style="padding: 40px; text-align: center; color: #999;">暂无数据</div>';
                return;
            }
            body.innerHTML = items.map(item => {
                const read = isRead(item.id);
                const titleStyle = item.status === 'discarded'
                    ? 'text-decoration: line-through; color: #999;'
                    : read ? 'color: #999;' : '';
                return `
                <div class="list-item" onclick="openDetail(${item.id})">
                    <span>${item.id}</span>
                    <span class="item-title ${read ? 'read' : ''}" style="font-weight: 500; ${titleStyle}">${read ? '<span style="color:#999;font-size:13px">●</span> ' : '<span style="color:#52c41a;font-size:13px">●</span> '}${item.title}</span>
                    <span class="item-status status ${item.status}">${statusMap[item.status] || item.status}</span>
                    <span class="item-category">${item.category || '-'}</span>
                    <span class="item-date">${formatDateTime(item.created_at)}</span>
                    <span class="item-comments">💬 ${item.comment_count || 0}</span>
                </div>`;
            }).join('');
        }
        
        async function openDetail(id) {
            // 标记为已读
            markAsRead(id);
            
            const res = await fetch(`${API_BASE}/api/intelligence/${id}`);
            currentIntel = await res.json();
            
            document.getElementById('modalTitle').textContent = currentIntel.title;
            document.getElementById('modalOverlay').style.display = 'block';
            document.getElementById('detailModal').classList.add('show');
            
            renderDetail();
            // 关闭弹窗后刷新列表，更新已读样式
            const origClose = closeModal;
            closeModal = function() {
                origClose();
                loadData();
            };
        }
        
        async function loadComments(id) {
            try {
                const res = await fetch(`${API_BASE}/api/intelligence/${id}/comments?limit=20`);
                const comments = await res.json();
                const container = document.getElementById('commentsContainer');
                if (!container) return;
                
                if (comments.length === 0) {
                    container.innerHTML = '<div style="color:#999;font-size:13px;padding:10px 0;">暂无评论</div>';
                    return;
                }
                
                container.innerHTML = comments.map(c => `
                    <div class="comment-item">
                        <div class="comment-header">
                            <span class="comment-agent">${escapeHtml(c.agent_name)}</span>
                            <span class="comment-time">${formatDateTime(c.created_at)}</span>
                        </div>
                        <div class="comment-content">${escapeHtml(c.content)}</div>
                    </div>
                `).join('');
            } catch(e) {
                const container = document.getElementById('commentsContainer');
                if (container) container.innerHTML = '<div style="color:#f5222d;font-size:13px;padding:10px 0;">加载评论失败</div>';
            }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // ========== Agent观点（随机一条商业挖掘点评） ==========
        async function loadAgentComment(id) {
            try {
                const res = await fetch(`${API_BASE}/api/intelligence/${id}/comments?limit=999`);
                const comments = await res.json();
                const container = document.getElementById('agentCommentContainer');
                if (!container) return;
                
                // 过滤出 agent_name 为"贾维斯"、"美雪"、"南希"、"马格南"的评论
                const agentComments = comments.filter(c => 
                    ['贾维斯', '美雪', '南希', '马格南'].includes(c.agent_name)
                );
                
                if (agentComments.length === 0) {
                    container.innerHTML = '<div style="color:#999;font-size:13px;padding:10px 0;">暂无点评</div>';
                    return;
                }
                
                // 随机选一条作为 Agent观点
                const randomIdx = Math.floor(Math.random() * agentComments.length);
                const c = agentComments[randomIdx];
                
                container.innerHTML = `
                    <div class="comment-item" style="border-left-color: #fa8c16; background: #fffbe6;">
                        <div class="comment-header">
                            <span class="comment-agent" style="color: #fa8c16;">💡 ${escapeHtml(c.agent_name)} 点评</span>
                            <span class="comment-time">${formatDateTime(c.created_at)}</span>
                        </div>
                        <div class="comment-content">${escapeHtml(c.content)}</div>
                    </div>
                `;
            } catch(e) {
                const container = document.getElementById('agentCommentContainer');
                if (container) container.innerHTML = '<div style="color:#f5222d;font-size:13px;padding:10px 0;">加载点评失败</div>';
            }
        }
        
        async function renderDetail() {
            const intel = currentIntel;
            
            const html = `
                <div class="detail-section">
                    <h3>状态</h3>
                    <div class="detail-content">
                        <span class="status ${intel.status}">${statusMap[intel.status] || intel.status}</span>
                        ${intel.opinion ? `<div style="margin-top: 10px;"><strong>意见:</strong> ${intel.opinion}</div>` : ''}
                    </div>
                </div>
                <div class="detail-section">
                    <h3>类别</h3>
                    <div class="detail-content">${intel.category || '-'}</div>
                </div>
                <div class="detail-section">
                    <h3>内容</h3>
                    <div class="detail-content markdown-body">${marked.parse(intel.content)}</div>
                </div>
                <!-- Agent观点 -->
                <div class="detail-section">
                    <h3>Agent观点</h3>
                    <div id="agentCommentContainer">
                        <div style="color:#999;font-size:13px;padding:10px 0;">加载中...</div>
                    </div>
                </div>
                <!-- Agent 评论列表 -->
                <div class="comments-section">
                    <h3>Agent 评论 <span style="font-weight:normal;font-size:12px;color:#999;">（${intel.comment_count || 0}条）</span></h3>
                    <div class="comments-scroll" id="commentsContainer">
                        <div style="color:#999;font-size:13px;padding:10px 0;">加载中...</div>
                    </div>
                </div>
                <!-- AI Agent 综合总结 -->
                <div id="detailSummaryContainer"></div>
            `;
            
            document.getElementById('modalBody').innerHTML = html;
            renderFooter(intel);
            loadAgentComment(intel.id);
            loadComments(intel.id);
            loadDetailSummary(intel.id);
        }
        
        function renderFooter(intel) {
            const footer = document.getElementById('modalFooter');
            let buttons = '';
            
            if (intel.status === 'pending') {
                buttons = `
                    <button class="btn-approve" onclick="updateStatus('approved')">建议跟进</button>
                    <button class="btn-reject" onclick="updateStatus('rejected')">不建议</button>
                `;
            } else if (intel.status === 'approved') {
                buttons = `<button class="btn-active" onclick="updateStatus('active')">激活项目</button>`;
            } else if (intel.status === 'active') {
                buttons = `<button class="btn-complete" onclick="updateStatus('completed')">标记完结</button>`;
            }
            
            // 任何状态都可以废止
            buttons += `<button style="background: #d9d9d9; color: #666; margin-left: 10px;" onclick="updateStatus('discarded')">废止</button>`;
            
            footer.innerHTML = buttons;
        }
        
        async function updateStatus(status) {
            if (status === 'discarded') {
                if (!confirm('确定要废止这条情报吗？')) return;
            }
            let opinion = '';
            if (status === 'approved') {
                opinion = prompt('请输入意见:');
                if (opinion === null) return;
            }
            
            const res = await fetch(`${API_BASE}/api/intelligence/${currentIntel.id}/status`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ status, opinion })
            });
            
            if (res.ok) {
                currentIntel.status = status;
                if (opinion) currentIntel.opinion = opinion;
                await renderDetail();
                await loadData();
            }
        }
        
        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
            document.getElementById('detailModal').classList.remove('show');
            currentIntel = null;
        }
        
        document.getElementById('modalOverlay').addEventListener('click', closeModal);
        
        // 监听返回键：模态窗打开时拦截返回，关闭模态窗；否则让浏览器正常处理
        window.addEventListener('popstate', function(e) {
            const detailModal = document.getElementById('detailModal');
            if (detailModal && detailModal.classList.contains('show')) {
                closeModal();
                history.pushState(null, '', location.href);
            }
        });
        
        // 打开模态窗时压入一个历史状态，这样返回键能拦截
        const origOpenDetail = openDetail;
        openDetail = function(id) {
            history.pushState(null, '', location.href);
            origOpenDetail(id);
        };
        
        loadData();
        loadCategories();
        
        async function loadDetailSummary(id) {
            try {
                const res = await fetch(`${API_BASE}/api/intelligence/${id}/summary`);
                if (!res.ok) return; // 没有总结就不显示
                const summary = await res.json();
                const container = document.getElementById('detailSummaryContainer');
                if (!container) return;
                
                container.innerHTML = `
                    <div class="detail-summary">
                        <div class="detail-summary-header">
                            <span class="detail-summary-title">📋 AI Agent 综合总结</span>
                            <span class="detail-summary-time">${formatDateTime(summary.updated_at)}</span>
                        </div>
                        <div class="detail-summary-content">${escapeHtml(summary.content)}</div>
                    </div>
                `;
            } catch(e) {
                // 加载失败或没有总结，不显示任何内容
            }
        }

        async function openCommand() {
            console.log('openCommand clicked');
            try {
                const res = await fetch(`${API_BASE}/api/commands`);
                console.log('response:', res);
                commands = await res.json();
                console.log('commands:', commands);
                renderCommands();
                document.getElementById('modalOverlay').style.display = 'block';
                document.getElementById('commandModal').classList.add('show');
            } catch(e) {
                console.error(e);
                alert('Error: ' + e.message);
            }
        }

        function closeCommand() {
            document.getElementById('modalOverlay').style.display = 'none';
            document.getElementById('commandModal').classList.remove('show');
        }

        function renderCommands() {
            const body = document.getElementById('commandBody');
            body.innerHTML = `
                <ul class="command-list" id="commandList">
                    ${commands.length === 0 ? '<li style="color: #999;">暂无指挥指令</li>' : commands.map((cmd, i) => `
                        <li draggable="true" data-index="${i}" data-id="${cmd.id}">
                            <span class="cmd-index">${i + 1}</span>
                            <span class="cmd-text">${cmd.content}</span>
                            <button class="cmd-delete" onclick="deleteCommand(${cmd.id})">&times;</button>
                        </li>
                    `).join('')}
                </ul>
                <div class="add-command">
                    <textarea id="newCommand" placeholder="输入新的情报搜集方向..."></textarea>
                    <button onclick="addCommand()">+ 添加</button>
                </div>
            `;
            initDragSort();
        }

        function initDragSort() {
            const list = document.getElementById('commandList');
            let draggedItem = null;

            // 使用事件委托，确保动态生成的 li 也能触发
            list.addEventListener('dragstart', (e) => {
                const li = e.target.closest('li[data-id]');
                if (li) {
                    draggedItem = li;
                    li.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/plain', li.dataset.id);
                }
            });

            list.addEventListener('dragend', (e) => {
                if (draggedItem) {
                    draggedItem.classList.remove('dragging');
                    draggedItem = null;
                }
            });

            list.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                const afterElement = getDragAfterElement(list, e.clientY);
                if (draggedItem) {
                    if (afterElement == null) {
                        list.appendChild(draggedItem);
                    } else {
                        list.insertBefore(draggedItem, afterElement);
                    }
                }
            });

            list.addEventListener('drop', async (e) => {
                e.preventDefault();
                const newOrder = Array.from(list.querySelectorAll('li[data-id]')).map(li => parseInt(li.dataset.id));
                console.log('Dropped, new order:', newOrder);
                await fetch(`${API_BASE}/api/commands/reorder`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ ids: newOrder })
                });
                const res = await fetch(`${API_BASE}/api/commands`);
                commands = await res.json();
                console.log('Reloaded commands:', commands);
                renderCommands();
            });
        }

        function getDragAfterElement(container, y) {
            const draggableElements = [...container.querySelectorAll('li[data-id]:not(.dragging)')];
            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closest.offset) {
                    return { offset: offset, element: child };
                } else {
                    return closest;
                }
            }, { offset: Number.NEGATIVE_INFINITY, element: null }).element;
        }

        async function addCommand() {
            const input = document.getElementById('newCommand');
            const content = input.value.trim();
            if (!content) return;

            await fetch(`${API_BASE}/api/commands`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ content })
            });

            input.value = '';
            const res = await fetch(`${API_BASE}/api/commands`);
            commands = await res.json();
            renderCommands();
        }

        async function deleteCommand(id) {
            await fetch(`${API_BASE}/api/commands/${id}`, { method: 'DELETE' });
            const res = await fetch(`${API_BASE}/api/commands`);
            commands = await res.json();
            renderCommands();
        }

        async function saveCommand() {
            const res = await fetch(`${API_BASE}/api/commands/generate`, { method: 'POST' });
            const data = await res.json();
            alert('已生成指令文件: ' + data.file);
            closeCommand();
        }
    </script>
</body>
</html>
