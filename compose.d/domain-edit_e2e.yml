# Auto-generated by domain provisioning — do not edit by hand.
# Domain: edit_e2e
services:
  domain_edit_e2e:
    image: intelligence-web-domain-generic:latest
    ports:
      - "8777:8777"
    networks:
      - intelligence_web_default
    environment:
      - JWT_SECRET=${JWT_SECRET:-30debd9f935044badf90a5130ba86c0ccacbf0e9d3e1fd031f20fe0885c1ef08}
      - CORS_ORIGINS=https://intelligence.nat.ywapi.com,http://intelligence.nat.ywapi.com,http://localhost:8765
      - ANALYZER_DB_SLUG=intelligence_edit_e2e
      - DOMAIN_KEY=edit-e2e
      - DOMAIN_SPEC_PATH=/app/spec.json
    command: >
      bash -c "
        cd /app && python -m core.scheduler &
        cd /app && gunicorn -w 2 -b 0.0.0.0:8777 --timeout 120 wsgi:app
      "
    volumes:
      - ${REPO_HOST}/domains/edit_e2e/data:/app/data
      - ${REPO_HOST}/domains/edit_e2e/spec.json:/app/spec.json:ro
      - ${REPO_HOST}/config:/app/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8777/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

networks:
  intelligence_web_default:
    external: true
