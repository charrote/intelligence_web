version: '3.8'

# 注意：engine.py 已废弃，情报采集由 OpenClaw Agent 定时任务自动执行
# 定时任务: intelligence-scout (全天每4小时: 0:00, 4:00, 8:00, 12:00, 16:00, 20:00)

services:
  api:
    build:
      context: ./intelligence_web
      dockerfile: Dockerfile.api
    container_name: intelligence_web_api
    ports:
      - "8766:8766"
    volumes:
      - ./intelligence_web/data:/app/data
    restart: always

  web:
    image: nginx:alpine
    container_name: intelligence_web_web
    ports:
      - "8765:80"
    volumes:
      - ./intelligence_web/web:/usr/share/nginx/html:ro
    depends_on:
      - api
    restart: always

networks:
  default:
    name: intelligence_network
