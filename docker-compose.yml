services:
  # Meilisearch
  meilisearch:
    image: getmeili/meilisearch:v1.12
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: "intel-search-key"
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - ./meili_data:/meili_data
    restart: unless-stopped

  # Research domain
  research:
    build:
      context: intelligence_web
      dockerfile: Dockerfile.api
    image: intelligence_web_api:latest
    ports:
      - "8766:8766"
    environment:
      - JWT_SECRET=${JWT_SECRET:-30debd9f935044badf90a5130ba86c0ccacbf0e9d3e1fd031f20fe0885c1ef08}
      - CORS_ORIGINS=https://intelligence.nat.ywapi.com,http://intelligence.nat.ywapi.com,http://localhost:8765
    volumes:
      - ./intelligence_web/data:/app/data
    restart: unless-stopped

  # Sales domain
  sales:
    build:
      context: intelligence_sales
      dockerfile: Dockerfile.api
    image: intelligence_sales_api:latest
    ports:
      - "8767:8767"
    environment:
      - JWT_SECRET=${JWT_SECRET:-30debd9f935044badf90a5130ba86c0ccacbf0e9d3e1fd031f20fe0885c1ef08}
      - CORS_ORIGINS=https://intelligence.nat.ywapi.com,http://intelligence.nat.ywapi.com,http://localhost:8765
    volumes:
      - ./intelligence_sales/data:/app/data
    restart: unless-stopped

  # Crawler Service
  crawler:
    build:
      context: crawler_service
      dockerfile: Dockerfile
    image: intelligence_crawler:latest
    ports:
      - "8768:8768"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./crawler_cache:/app/.crawl4ai_cache
    restart: unless-stopped

  # nginx gateway
  gateway:
    image: nginx:alpine
    ports:
      - "8765:80"
    volumes:
      - ./portal:/var/www/portal
      - ./intelligence_sales/web:/var/www/intelligence_sales
      - ./favicon.ico:/var/www/favicon.ico
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - research
      - sales
      - crawler
    restart: unless-stopped