<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抽取规则管理</title>
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/sidebar.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
<script src="js/dom.js"></script>
<script src="js/auth.js"></script>
<script src="js/init.js"></script>
<script src="js/tabs.js"></script>
<style>
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.status-dot.on{background:var(--green)}.status-dot.off{background:var(--gray-400)}
.btn-icon{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border:none;border-radius:var(--radius);background:transparent;color:var(--gray-500);cursor:pointer;transition:all 0.12s;padding:0;position:relative}
.btn-icon:hover{background:var(--gray-100);color:var(--gray-700)}
.btn-icon::after{content:attr(data-tip);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:6px;padding:4px 8px;background:#1a1a1a;color:#fff;font-size:11px;border-radius:4px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity 0.15s;z-index:10}
.btn-icon:hover::after{opacity:1}
.btn-icon.btn-warning:hover{background:#fef7e6;color:#b8862d}
.btn-icon.btn-danger:hover{background:var(--red-light);color:var(--red)}
.btn-icon.btn-info:hover{background:var(--blue-light);color:var(--blue)}
.action-cell{position:sticky;right:0;background:#fff;z-index:1;min-width:90px;text-align:right;padding:10px 12px!important}
.action-cell td:last-child{border-left:1px solid var(--gray-200)}
.action-btns{display:flex;gap:4px;justify-content:flex-end;align-items:center}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);padding:14px 18px;box-shadow:var(--shadow-sm)}
.stat-num{font-size:22px;font-weight:600;color:var(--gray-800);letter-spacing:-0.3px;line-height:1.2}
.stat-label{font-size:12px;color:var(--gray-400);margin-top:2px}
.field-table{width:100%;border-collapse:collapse;margin:10px 0 4px;font-size:13px}
.field-table th{text-align:left;padding:6px 10px;font-size:11px;font-weight:600;color:var(--gray-400);border-bottom:1px solid var(--gray-200);background:var(--gray-50)}
.field-table td{padding:6px 10px;border-bottom:1px solid var(--gray-100);color:var(--gray-600);vertical-align:middle}
.field-table .form-group{margin-bottom:4px}
.field-table input,.field-table select{width:100%;padding:5px 8px;border:1px solid var(--gray-200);border-radius:var(--radius);font-size:12px;color:var(--gray-700);background:#fff}
.field-table input:focus,.field-table select:focus{outline:none;border-color:var(--accent)}
.section-label{font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:8px}
.empty-field{padding:12px;text-align:center;color:var(--gray-400);font-size:12px;border:1px dashed var(--gray-200);border-radius:var(--radius)}
</style>
</head>
<body>
<main class="main">
  <h1>抽取规则管理</h1>
  <p class="sub">定义从情报中自动提取哪些字段，AI 将在情报采集后离线执行抽取</p>

  <div class="stats" id="statsBar">
    <div class="stat"><div class="stat-num" id="statTotal">-</div><div class="stat-label">总情报</div></div>
    <div class="stat"><div class="stat-num" id="statExtracted">-</div><div class="stat-label">已抽取</div></div>
    <div class="stat"><div class="stat-num" id="statCoverage">-</div><div class="stat-label">覆盖率</div></div>
    <div class="stat"><div class="stat-num" id="statPending">-</div><div class="stat-label">待抽取</div></div>
  </div>

  <div class="toolbar">
    <select id="filterStatus">
      <option value="">全部</option>
      <option value="active">🟢 启用</option>
      <option value="inactive">⚪ 已禁用</option>
    </select>
    <select id="filterDomain">
      <option value="">全部域</option>
      <option value="research">research</option>
      <option value="sales">sales</option>
    </select>
    <span class="spacer"></span>
    <button class="btn btn-primary" onclick="openCreate()">+ 新建规则</button>
  </div>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>名称</th>
          <th>域</th>
          <th>状态</th>
          <th>字段数</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" style="width:620px">
      <div class="modal-header">
        <h2 id="modalTitle">新建抽取规则</h2>
        <button class="btn-icon" onclick="closeModal()" data-tip="关闭"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>规则名称 *</label>
          <input type="text" id="ruleName" placeholder="输入规则名称">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>域 *</label>
            <select id="ruleDomain">
              <option value="research">research</option>
              <option value="sales">sales</option>
            </select>
          </div>
          <div class="form-group">
            <label>范围</label>
            <select id="ruleScope">
              <option value="full">全文</option>
              <option value="full+tables">全文 + 表格</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>最大字段数</label>
            <input type="number" id="ruleMaxFields" value="20" min="1" max="100">
          </div>
          <div class="form-group">
            <label>&nbsp;</label>
            <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;margin-top:4px">
              <input type="checkbox" id="ruleEnabled" checked> 启用规则
            </label>
          </div>
        </div>
        <div class="form-group">
          <label>描述</label>
          <textarea id="ruleDesc" rows="2" placeholder="规则描述（可选）" style="width:100%;padding:8px 10px;border:1px solid var(--gray-200);border-radius:var(--radius);font-size:13px;color:var(--gray-800);resize:vertical"></textarea>
        </div>
        <div class="section-label">抽取字段</div>
        <div id="fieldsContainer"></div>
        <button class="btn btn-ghost" onclick="addFieldRow()" style="margin-top:6px;font-size:12px">+ 添加字段</button>
        <div id="modalFeedback" style="display:none;padding:10px;border-radius:var(--radius);font-size:13px;margin-top:10px"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal()">取消</button>
        <button class="btn btn-primary" onclick="saveRule()">保存规则</button>
      </div>
    </div>
  </div>
</main>

<script>
var rules = [];
var editingId = null;

async function init() {
  try {
    var r = await apiFetch(APP_API_BASE + '/api/extract/rules');
    rules = await r.json();
    renderTable();
  } catch(e) {
    document.getElementById('tableBody').innerHTML = '<tr><td colspan="5" class="empty">加载失败</td></tr>';
  }
  loadStats();
}

function renderTable() {
  var statusF = document.getElementById('filterStatus').value;
  var domainF = document.getElementById('filterDomain').value;
  var filtered = rules;
  if (statusF) filtered = filtered.filter(function(r) { return r.enabled === (statusF === 'active'); });
  if (domainF) filtered = filtered.filter(function(r) { return r.domain === domainF; });

  var html = '';
  if (!filtered.length) {
    html = '<tr><td colspan="5" class="empty">暂无抽取规则</td></tr>';
  } else {
    filtered.forEach(function(r) {
      var builtIn = r.built_in === 1 || r.built_in === true;
      var domainLabel = r.domain === 'sales' ? 'sales' : 'research';
      html += '<tr>'
        + '<td><strong>' + escapeHtml(r.name || '-') + '</strong></td>'
        + '<td><span class="tag">' + escapeHtml(domainLabel) + '</span></td>'
        + '<td><span class="status-dot ' + (r.enabled ? 'on' : 'off') + '"></span>' + (r.enabled ? '启用' : '停用') + '</td>'
        + '<td>' + (r.fields ? r.fields.length : 0) + '</td>'
        + '<td class="action-cell">'
          + '<div class="action-btns">'
          + '<button class="btn-icon btn-info" onclick="triggerExtract(' + r.id + ')" data-tip="立即抽取"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></button>'
          + '<button class="btn-icon" onclick="editRule(' + r.id + ')" data-tip="编辑"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>'
          + (!builtIn ? '<button class="btn-icon btn-danger" onclick="deleteRule(' + r.id + ')" data-tip="删除"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>'
            : '<button class="btn-icon" disabled style="opacity:0.3;cursor:not-allowed" data-tip="内置规则不可删除"></button>')
          + '</div>'
        + '</td>'
        + '</tr>';
    });
  }
  document.getElementById('tableBody').innerHTML = html;
}

async function loadStats() {
  try {
    var r = await apiFetch(APP_API_BASE + '/api/extract/stats');
    var s = await r.json();
    document.getElementById('statTotal').textContent = s.total || 0;
    document.getElementById('statExtracted').textContent = s.extracted || 0;
    var coverage = s.total ? Math.round((s.extracted / s.total) * 100) : 0;
    document.getElementById('statCoverage').textContent = coverage + '%';
    document.getElementById('statPending').textContent = s.pending || 0;
  } catch(e) {
    document.getElementById('statTotal').textContent = '-';
    document.getElementById('statExtracted').textContent = '-';
    document.getElementById('statCoverage').textContent = '-';
    document.getElementById('statPending').textContent = '-';
  }
}

function openCreate() {
  editingId = null;
  document.getElementById('modalTitle').textContent = '新建抽取规则';
  document.getElementById('ruleName').value = '';
  document.getElementById('ruleDomain').value = 'research';
  document.getElementById('ruleScope').value = 'full';
  document.getElementById('ruleMaxFields').value = 20;
  document.getElementById('ruleEnabled').checked = true;
  document.getElementById('ruleDesc').value = '';
  document.getElementById('fieldsContainer').innerHTML = '';
  document.getElementById('modalFeedback').style.display = 'none';
  addFieldRow();
  openModal();
  document.getElementById('ruleName').focus();
}

function editRule(id) {
  var rule = rules.find(function(r) { return r.id === id; });
  if (!rule) return;
  editingId = id;
  document.getElementById('modalTitle').textContent = '编辑抽取规则';
  document.getElementById('ruleName').value = rule.name || '';
  document.getElementById('ruleDomain').value = rule.domain || 'research';
  document.getElementById('ruleScope').value = rule.scope || 'full';
  document.getElementById('ruleMaxFields').value = rule.max_fields || 20;
  document.getElementById('ruleEnabled').checked = rule.enabled !== false;
  document.getElementById('ruleDesc').value = rule.description || '';
  document.getElementById('modalFeedback').style.display = 'none';

  var fields = rule.fields || [];
  document.getElementById('fieldsContainer').innerHTML = '';
  if (fields.length === 0) {
    addFieldRow();
  } else {
    fields.forEach(function(f) {
      addFieldRow({
        label: f.label || '',
        field: f.field || '',
        type: f.type || 'text',
        required: f.required === true || f.required === 1,
        order: f.order || 0
      });
    });
  }
  openModal();
}

function openModal() {
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

function addFieldRow(data) {
  var container = document.getElementById('fieldsContainer');
  var idx = container.children.length;
  var types = ['company','pct','currency','currency_code','location','year','text','number','date'];
  var typeOptions = types.map(function(t) { return '<option value="' + t + '">' + t + '</option>'; }).join('');
  var html = '<div class="field-row" style="display:grid;grid-template-columns:100px 120px 100px 70px 50px 36px;gap:6px;align-items:center;margin-bottom:6px">'
    + '<div class="form-group"><input type="text" class="fld-label" placeholder="中文名" value="' + escapeHtml((data && data.label) || '') + '"></div>'
    + '<div class="form-group"><input type="text" class="fld-field" placeholder="字段标识" value="' + escapeHtml((data && data.field) || '') + '"></div>'
    + '<div class="form-group"><select class="fld-type">' + typeOptions + '</select></div>'
    + '<div class="form-group"><input type="checkbox" class="fld-required"' + ((data && data.required) ? ' checked' : '') + '></div>'
    + '<div class="form-group"><input type="number" class="fld-order" value="' + (data && data.order !== undefined ? data.order : idx) + '" min="0" style="width:100%;padding:5px 8px;border:1px solid var(--gray-200);border-radius:var(--radius);font-size:12px;color:var(--gray-700)"></div>'
    + '<div style="text-align:center"><button type="button" class="btn-icon btn-danger" onclick="removeFieldRow(this)" data-tip="删除"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>'
    + '</div>';
  container.insertAdjacentHTML('beforeend', html);
}

function removeFieldRow(btn) {
  btn.closest('.field-row').remove();
}

async function saveRule() {
  var name = document.getElementById('ruleName').value.trim();
  var domain = document.getElementById('ruleDomain').value;
  var scope = document.getElementById('ruleScope').value;
  var maxFields = parseInt(document.getElementById('ruleMaxFields').value) || 20;
  var enabled = document.getElementById('ruleEnabled').checked;
  var desc = document.getElementById('ruleDesc').value.trim();
  var fb = document.getElementById('modalFeedback');

  if (!name) {
    fb.style.display = 'block';
    fb.style.background = '#fceef0';
    fb.style.color = 'var(--red)';
    fb.textContent = '规则名称为必填项';
    return;
  }

  // Collect fields
  var fieldRows = document.querySelectorAll('.field-row');
  var fields = [];
  fieldRows.forEach(function(row) {
    var label = row.querySelector('.fld-label').value.trim();
    var field = row.querySelector('.fld-field').value.trim();
    var type = row.querySelector('.fld-type').value;
    var required = row.querySelector('.fld-required').checked;
    var order = parseInt(row.querySelector('.fld-order').value) || 0;
    if (label || field) {
      fields.push({ label: label, field: field, type: type, required: required, order: order });
    }
  });

  var payload = { name: name, domain: domain, scope: scope, max_fields: maxFields, enabled: enabled, description: desc, fields: fields };

  try {
    var method = editingId ? 'PUT' : 'POST';
    var urlPath = editingId ? APP_API_BASE + '/api/extract/rules/' + editingId : APP_API_BASE + '/api/extract/rules';
    var r = await apiFetch(urlPath, {
      method: method,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (r.ok) {
      closeModal();
      init();
    } else {
      var data = await r.json();
      fb.style.display = 'block';
      fb.style.background = '#fceef0';
      fb.style.color = 'var(--red)';
      fb.textContent = data.error || '保存失败';
    }
  } catch(e) {
    fb.style.display = 'block';
    fb.style.background = '#fceef0';
    fb.style.color = 'var(--red)';
    fb.textContent = '请求失败：' + (e.message || '保存失败');
  }
}

async function triggerExtract(id) {
  try {
    var r = await apiFetch(APP_API_BASE + '/api/extract/rules/' + id + '/trigger', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' }
    });
    if (r.ok) {
      alert('抽取任务已提交');
    } else {
      var data = await r.json();
      alert(data.error || '提交失败');
    }
  } catch(e) {
    alert('请求失败：' + (e.message || '提交失败'));
  }
}

async function deleteRule(id) {
  if (!confirm('确定删除此规则？此操作不可恢复。')) return;
  try {
    var r = await apiFetch(APP_API_BASE + '/api/extract/rules/' + id, { method: 'DELETE' });
    if (r.ok) {
      init();
    } else {
      var data = await r.json();
      alert(data.error || '删除失败');
    }
  } catch(e) {
    alert('删除失败：' + (e.message || ''));
  }
}

document.getElementById('filterStatus').onchange = renderTable;
document.getElementById('filterDomain').onchange = renderTable;

init();
</script>
</body>
</html>
