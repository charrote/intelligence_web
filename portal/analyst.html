<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 分析师</title>
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/sidebar.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
<script src="js/dom.js"></script>
<script src="js/auth.js"></script>
<script src="js/init.js"></script>
<script src="js/tabs.js"></script>
<style>
.main{display:flex;flex-direction:column;max-width:860px;width:100%;margin:0 auto;padding:24px}
.chat-area{flex:1;overflow-y:auto;padding:8px 0}
.message{display:flex;gap:12px;margin-bottom:20px;animation:fadeIn 0.2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.message.user{flex-direction:row-reverse}
.avatar{width:32px;height:32px;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.avatar.ai{background:var(--accent);color:#fff}
.avatar.me{background:var(--gray-200);color:var(--gray-600)}
.bubble{max-width:75%;padding:12px 16px;border-radius:var(--radius);font-size:14px;line-height:1.7;color:var(--gray-800)}
.message.user .bubble{background:#fff;border:1px solid var(--gray-200)}
.message.ai .bubble{background:var(--accent-light);border:1px solid transparent}
.bubble h1,.bubble h2,.bubble h3{font-size:15px;font-weight:600;margin:12px 0 6px;color:var(--gray-800)}
.bubble h1:first-child,.bubble h2:first-child,.bubble h3:first-child{margin-top:0}
.bubble ul,.bubble ol{padding-left:18px;margin:6px 0}
.bubble li{margin-bottom:3px}
.bubble strong{font-weight:600}
.bubble code{background:rgba(0,0,0,0.06);padding:1px 4px;border-radius:3px;font-size:12px}
.bubble pre{background:var(--gray-800);color:#e0e1e3;padding:12px;border-radius:var(--radius);overflow-x:auto;font-size:12px;margin:8px 0}
.bubble pre code{background:none;color:inherit;padding:0}
.input-area{border-top:1px solid var(--gray-200);padding-top:16px}
.input-wrap{display:flex;gap:8px;align-items:flex-end;background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);padding:8px 12px;transition:border-color 0.2s}
.input-wrap:focus-within{border-color:var(--accent)}
#chatInput{flex:1;border:none;outline:none;font-size:14px;line-height:1.5;resize:none;max-height:120px;font-family:inherit;color:var(--gray-800)}
#chatInput::placeholder{color:var(--gray-400)}
.send-btn{width:36px;height:36px;border:none;border-radius:var(--radius);background:var(--accent);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background 0.15s}
.send-btn:hover{background:#2f3f70}
.send-btn:disabled{background:var(--gray-300);cursor:not-allowed}
.send-btn svg{width:16px;height:16px}
.quick-prompts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.quick-prompt{padding:5px 12px;border:1px solid var(--gray-200);border-radius:20px;background:#fff;font-size:12px;color:var(--gray-600);cursor:pointer;transition:all 0.15s}
.quick-prompt:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
.typing-indicator{display:flex;gap:4px;padding:4px 0}
.typing-indicator span{width:6px;height:6px;border-radius:50%;background:var(--gray-400);animation:typing 1.2s infinite}
.typing-indicator span:nth-child(2){animation-delay:0.2s}
.typing-indicator span:nth-child(3){animation-delay:0.4s}
@keyframes typing{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-4px)}}
.empty-state{text-align:center;padding:60px 20px;color:var(--gray-400)}
.empty-state svg{width:48px;height:48px;margin-bottom:16px;color:var(--gray-300)}
.empty-state h3{font-size:16px;font-weight:500;color:var(--gray-600);margin-bottom:8px}
.empty-state p{font-size:13px}
</style>
</head>
<body>
<main class="main">
  <div class="chat-area" id="chatArea">
    <div class="empty-state" id="emptyState">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2a7 7 0 0 1 7 7c0 2.38-1.19 4.47-3 5.74V17a1 1 0 0 1-1 1h-6a1 1 0 0 1-1-1v-2.26C6.19 13.47 5 11.38 5 9a7 7 0 0 1 7-7z"/><line x1="9" y1="21" x2="15" y2="21"/><line x1="10" y1="23" x2="14" y2="23"/></svg>
      <h3>问我任何情报问题</h3>
      <p>我会基于已采集的情报数据为你分析</p>
    </div>
  </div>

  <div class="quick-prompts" id="quickPrompts">
    <button class="quick-prompt" onclick="askPrompt(this)">当前竞争格局</button>
    <button class="quick-prompt" onclick="askPrompt(this)">本月新增情报</button>
    <button class="quick-prompt" onclick="askPrompt(this)">重点关注客户动态</button>
    <button class="quick-prompt" onclick="askPrompt(this)">供应商产能变化</button>
  </div>

  <div class="input-area">
    <div class="input-wrap">
      <textarea id="chatInput" rows="1" placeholder="输入你的问题..." onkeydown="handleKey(event)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>
</main>

<script>
let currentDomain = 'intelligence_web';

// Auto-resize textarea
const chatInput = document.getElementById('chatInput');
chatInput.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function askPrompt(btn) {
  chatInput.value = btn.textContent;
  sendMessage();
}

async function sendMessage() {
  const input = document.getElementById('chatInput');
  const query = input.value.trim();
  if (!query) return;

  input.value = '';
  input.style.height = 'auto';

  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('quickPrompts').style.display = 'none';

  addMessage('user', query);

  const typingId = showTyping();

  try {
    const res = await apiFetch(APP_API_BASE + '/api/analyst/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        query: query,
        domain: currentDomain,
        max_results: 20
      })
    });

    removeMessage(typingId);

    if (res.ok) {
      const data = await res.json();
      addMessage('ai', formatMarkdown(data.analysis || '没有返回结果'));
    } else {
      const err = await res.json().catch(() => ({}));
      addMessage('ai', err.error || '请求失败，请重试');
    }
  } catch(e) {
    removeMessage(typingId);
    addMessage('ai', '网络错误：' + e.message);
  }
}

function addMessage(role, content) {
  const chatArea = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = 'message ' + role;
  const avatarClass = role === 'ai' ? 'ai' : 'me';
  const avatarText = role === 'ai' ? 'AI' : '我';
  div.innerHTML = '<div class="avatar ' + avatarClass + '">' + avatarText + '</div>'
    + '<div class="bubble">' + (role === 'ai' ? renderMarkdown(content) : escapeHtml(content)) + '</div>';
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function showTyping() {
  const chatArea = document.getElementById('chatArea');
  const div = document.createElement('div');
  const id = 'typing-' + Date.now();
  div.id = id;
  div.className = 'message ai';
  div.innerHTML = '<div class="avatar ai">AI</div><div class="bubble"><div class="typing-indicator"><span></span><span></span><span></span></div></div>';
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
  return id;
}

function removeMessage(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

function switchDomain(domain) {
  currentDomain = domain;
  document.getElementById('chatArea').innerHTML = document.getElementById('emptyState').outerHTML;
}

function renderMarkdown(text) {
  let html = escapeHtml(text);
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/^\- (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
  html = html.replace(/\n\n/g, '<br/><br/>');
  html = html.replace(/\n/g, '<br/>');
  return html;
}
</script>
</body>
</html>
