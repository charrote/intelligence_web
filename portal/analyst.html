<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 分析师 — 快速执行</title>
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/sidebar.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script src="js/dom.js"></script>
<script src="js/auth.js"></script>
<script src="js/init.js"></script>
<script src="js/tabs.js"></script>
<style>
/* ── Layout ── */
.main{display:flex;flex-direction:column;max-width:960px;width:100%;margin:0 auto;padding:24px;height:calc(100vh - 140px);overflow-y:auto}
.card{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);overflow:hidden;margin-bottom:16px}
.card-head{display:flex;align-items:center;padding:14px 20px;border-bottom:1px solid var(--gray-100);gap:12px}
.card-head h2{font-size:15px;font-weight:600;color:var(--gray-800);margin:0;flex:1}
.card-body{padding:20px}

/* ── Form ── */
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--gray-500);margin-bottom:6px}
.form-select{width:100%;padding:10px 12px;border:1px solid var(--gray-200);border-radius:var(--radius);font-size:14px;color:var(--gray-800);background:#fff;cursor:pointer;transition:border-color 0.15s}
.form-select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-light)}
.radio-group{display:flex;gap:6px;flex-wrap:wrap}
.radio-group label{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border:1px solid var(--gray-200);border-radius:var(--radius);font-size:12px;color:var(--gray-600);cursor:pointer;transition:all 0.15s;user-select:none}
.radio-group label:has(input:checked){border-color:var(--accent);background:var(--accent-light);color:var(--accent);font-weight:500}
.radio-group input[type="radio"]{width:auto;accent-color:var(--accent)}
.form-meta{font-size:12px;color:var(--gray-400);margin-top:8px}
.form-meta strong{color:var(--gray-600)}

/* ── Button ── */
.exec-wrap{display:flex;gap:8px;align-items:center;margin-top:4px}
.btn-exec{flex:1;padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);font-size:14px;font-weight:600;cursor:pointer;transition:all 0.15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-exec:hover{background:#2f3f70;box-shadow:0 2px 8px rgba(59,79,140,0.25)}
.btn-exec:disabled{background:var(--gray-300);cursor:not-allowed;box-shadow:none}
.btn-exec svg{width:16px;height:16px}

/* ── Progress ── */
.progress-steps{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.progress-step{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--gray-400);transition:color 0.2s}
.progress-step.active{color:var(--gray-700)}
.progress-step.done{color:var(--green)}
.step-icon{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;background:var(--gray-100);color:var(--gray-400);border:2px solid var(--gray-200)}
.progress-step.active .step-icon{background:var(--accent-light);color:var(--accent);border-color:var(--accent)}
.progress-step.done .step-icon{background:var(--green-light);color:#fff;border-color:var(--green)}
.progress-step.done .step-icon::after{content:'\2713';font-weight:700}
.progress-bar-wrap{height:6px;background:var(--gray-100);border-radius:3px;overflow:hidden;margin-bottom:12px}
.progress-bar-fill{height:100%;background:var(--accent);border-radius:3px;transition:width 0.4s ease;animation:progressPulse 1.5s ease-in-out infinite}
@keyframes progressPulse{0%,100%{opacity:1}50%{opacity:0.7}}

/* ── Result ── */
.result-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--gray-200)}
.result-status{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600}
.result-status.success{color:var(--green)}
.result-status.error{color:var(--red)}
.result-meta{font-size:12px;color:var(--gray-400)}
.result-meta strong{color:var(--gray-600)}
/* Charts */
.chart-container{margin:16px 0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--accent-mid);background:#fff;box-shadow:var(--shadow-sm)}
.chart-header{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:var(--gray-50);border-bottom:1px solid var(--gray-200);font-size:12px;font-weight:600;color:var(--gray-600)}
.chart-header .chart-type{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:10px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px}
.chart-type.pie{background:var(--blue-light);color:var(--blue)}
.chart-type.bar{background:var(--green-light);color:var(--green)}
.chart-type.line{background:var(--amber-light);color:var(--amber)}
.chart-body{width:100%;height:300px}
@media(max-width:600px){.chart-body{height:220px}}
/* Markdown */
.markdown-content{font-size:14px;line-height:1.75;color:var(--gray-700)}
.markdown-content h2{font-size:15px;font-weight:600;margin:14px 0 8px;color:var(--gray-800);padding-bottom:4px;border-bottom:1px solid var(--gray-200)}
.markdown-content h2:first-child{margin-top:0}
.markdown-content h3{font-size:14px;font-weight:600;margin:12px 0 6px;color:var(--gray-700)}
.markdown-content p{margin:6px 0}
.markdown-content ul,.markdown-content ol{padding-left:20px;margin:8px 0}
.markdown-content li{margin-bottom:4px}
.markdown-content strong{font-weight:600;color:var(--gray-800)}
.markdown-content code{background:rgba(0,0,0,0.06);padding:1px 5px;border-radius:4px;font-size:12px;font-family:'SF Mono',Monaco,Consolas,monospace}
.markdown-content pre{background:var(--gray-800);color:#e0e1e3;padding:14px;border-radius:var(--radius);overflow-x:auto;font-size:12px;line-height:1.6;margin:10px 0;font-family:'SF Mono',Monaco,Consolas,monospace}
.markdown-content pre code{background:none;color:inherit;padding:0}
.markdown-content blockquote{border-left:3px solid var(--accent);padding:6px 14px;margin:10px 0;background:rgba(59,79,140,0.04);color:var(--gray-600);border-radius:0 var(--radius) var(--radius) 0}
.markdown-content table{border-collapse:collapse;width:100%;margin:10px 0;font-size:13px}
.markdown-content th{background:var(--gray-50);padding:8px 10px;text-align:left;font-weight:600;color:var(--gray-600);border:1px solid var(--gray-200)}
.markdown-content td{padding:8px 10px;border:1px solid var(--gray-200);color:var(--gray-700)}
.markdown-content tr:nth-child(even) td{background:var(--gray-50)}
.markdown-content hr{border:none;border-top:1px solid var(--gray-200);margin:14px 0}
.markdown-content a{color:var(--accent);text-decoration:none}
.markdown-content a:hover{text-decoration:underline}
/* Summary */
.summary-box{padding:14px 16px;background:var(--accent-light);border-radius:var(--radius);font-size:13px;line-height:1.7;color:var(--gray-700);margin-top:12px}
.summary-label{font-size:11px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px}

/* ── Report List ── */
.report-list{display:flex;flex-direction:column;gap:8px}
.report-item{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--gray-50);border:1px solid var(--gray-200);border-radius:var(--radius);cursor:pointer;transition:all 0.15s}
.report-item:hover{border-color:var(--accent);background:#fff}
.report-title{font-size:14px;font-weight:500;color:var(--gray-800);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.report-meta{display:flex;gap:12px;align-items:center;font-size:12px;color:var(--gray-500);margin-left:12px}
.status-badge{display:inline-flex;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.status-badge.completed{background:var(--green-light);color:var(--green)}
.status-badge.failed{background:var(--red-light);color:var(--red)}
.status-badge.running{background:var(--amber-light);color:var(--amber)}
.empty-state{text-align:center;padding:30px;color:var(--gray-400);font-size:14px}

/* ── Error ── */
.error-box{padding:14px 16px;background:#fceef0;border-radius:var(--radius);font-size:13px;color:var(--red);line-height:1.6}
</style>
</head>
<body>
<main class="main">
  <!-- Template Selection -->
  <div class="card" id="selectionCard">
    <div class="card-head"><h2>快速执行</h2></div>
    <div class="card-body">
      <div class="form-group">
        <label class="form-label">选择报告模板</label>
        <select class="form-select" id="templateSelect">
          <option value="">加载中...</option>
        </select>
        <div class="form-meta" id="templateMeta"></div>
      </div>
      <div class="form-group">
        <label class="form-label">数据范围</label>
        <div class="radio-group" id="timeRangeGroup">
          <label><input type="radio" name="lookback" value="7"> 近 7 天</label>
          <label><input type="radio" name="lookback" value="14"> 近 14 天</label>
          <label><input type="radio" name="lookback" value="30" checked> 近 30 天</label>
          <label><input type="radio" name="lookback" value="60"> 近 60 天</label>
          <label><input type="radio" name="lookback" value="90"> 近 90 天</label>
        </div>
      </div>
      <div class="exec-wrap">
        <button class="btn-exec" id="execBtn" onclick="runNow()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          立即生成报告
        </button>
      </div>
    </div>
  </div>

  <!-- Progress -->
  <div class="card" id="progressCard" style="display:none">
    <div class="card-head"><h2>执行进度</h2></div>
    <div class="card-body">
      <div class="progress-steps">
        <div class="progress-step" id="stepQuery"><span class="step-icon"></span> 正在检索数据...</div>
        <div class="progress-step" id="stepAI"><span class="step-icon"></span> 正在调用 AI 分析...</div>
        <div class="progress-step" id="stepDone"><span class="step-icon"></span> 完成</div>
      </div>
      <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progressFill" style="width:0%"></div></div>
    </div>
  </div>

  <!-- Error -->
  <div class="card" id="errorCard" style="display:none">
    <div class="card-head"><h2>执行失败</h2></div>
    <div class="card-body">
      <div class="error-box" id="errorMsg"></div>
    </div>
  </div>

  <!-- Result -->
  <div class="card" id="resultCard" style="display:none">
    <div class="card-head"><h2>分析结果</h2></div>
    <div class="card-body">
      <div class="result-header" id="resultHeader"></div>
      <div class="markdown-content" id="resultMarkdown"></div>
      <div id="resultCharts"></div>
      <div class="summary-box" id="resultSummary" style="display:none">
        <div class="summary-label">摘要</div>
        <div id="resultSummaryText"></div>
      </div>
      <div style="margin-top:16px;text-align:center">
        <button class="btn btn-ghost" style="font-size:12px" onclick="location.hash='#report-view?run_id=' + currentRunId">
          在报告查看页打开
        </button>
      </div>
    </div>
  </div>

  <!-- Recent Reports -->
  <div class="card" id="reportListCard">
    <div class="card-head"><h2>最近执行</h2></div>
    <div class="card-body">
      <div id="reportListContainer"><div class="empty-state">加载中...</div></div>
    </div>
  </div>
</main>

<script>
var chartInstances = [];
var currentRunId = null;
var pollTimer = null;

// ── Init ──
document.addEventListener('DOMContentLoaded', function() {
  loadTemplates();
  loadOverview();
});

// ── Load enabled templates ──
async function loadTemplates() {
  try {
    var res = await fetch('/api/reports/templates?enabled=1', {
      headers: { 'Authorization': getAuthHeader() }
    });
    var data = await res.json();
    var select = document.getElementById('templateSelect');
    select.innerHTML = '';
    if (data.templates && data.templates.length > 0) {
      data.templates.forEach(function(t) {
        var opt = document.createElement('option');
        opt.value = t.id;
        opt.textContent = t.name + ' (' + (t.domain || '-') + ')';
        select.appendChild(opt);
      });
      // Update meta for first template
      updateMeta(data.templates[0]);
    } else {
      select.innerHTML = '<option value="">暂无可用模板，请先在「报告模板」页创建</option>';
      document.getElementById('execBtn').disabled = true;
    }
  } catch (e) {
    document.getElementById('templateSelect').innerHTML = '<option value="">加载失败</option>';
  }
}

function updateMeta(t) {
  var meta = document.getElementById('templateMeta');
  var parts = ['域: <strong>' + (t.domain || '-') + '</strong>'];
  if (t.schedule_time) parts.push('下次执行: ' + t.schedule_time);
  meta.innerHTML = parts.join(' | ');
}

document.getElementById('templateSelect').addEventListener('change', function() {
  var id = this.value;
  if (!id) { document.getElementById('templateMeta').innerHTML = ''; return; }
  // Find template data from overview
  apiFetch('/api/reports/overview', { headers: { 'Authorization': getAuthHeader() } })
    .then(function(r) { return r.json(); })
    .then(function(list) {
      for (var i = 0; i < list.length; i++) {
        if (list[i].template_id == id) { updateMeta(list[i]); break; }
      }
    })
    .catch(function() {});
});

// ── Run Now ──
async function runNow() {
  var templateId = document.getElementById('templateSelect').value;
  var lookback = document.querySelector('input[name="lookback"]:checked').value;
  if (!templateId) { alert('请选择报告模板'); return; }

  showProgress();
  document.getElementById('execBtn').disabled = true;

  try {
    var res = await fetch('/api/reports/run/' + templateId, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': getAuthHeader()
      },
      body: JSON.stringify({ lookback_days: parseInt(lookback) })
    });
    var data = await res.json();

    if (data.ok) {
      currentRunId = data.run_id;
      startPolling(templateId);
    } else {
      hideProgress();
      showError(data.error || '执行失败');
    }
  } catch (e) {
    hideProgress();
    showError('网络错误: ' + (e.message || ''));
  }
}

// ── Progress ──
function showProgress() {
  document.getElementById('progressCard').style.display = 'block';
  document.getElementById('resultCard').style.display = 'none';
  document.getElementById('errorCard').style.display = 'none';
  document.getElementById('stepQuery').className = 'progress-step active';
  document.getElementById('stepAI').className = 'progress-step';
  document.getElementById('stepDone').className = 'progress-step';
  document.getElementById('progressFill').style.width = '10%';
}

function hideProgress() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  document.getElementById('progressCard').style.display = 'none';
}

// ── Poll execution status ──
function startPolling(templateId) {
  pollTimer = setInterval(async function() {
    try {
      var res = await fetch('/api/reports/runs/' + templateId + '?limit=1', {
        headers: { 'Authorization': getAuthHeader() }
      });
      var data = await res.json();
      if (!data.runs || data.runs.length === 0) return;

      var latest = data.runs[0];
      document.getElementById('progressFill').style.width = '45%';

      if (latest.status === 'running') {
        document.getElementById('stepQuery').className = 'progress-step done';
        document.getElementById('stepAI').className = 'progress-step active';
        document.getElementById('progressFill').style.width = '70%';
      } else if (latest.status === 'completed') {
        clearInterval(pollTimer);
        hideProgress();
        showResult(latest.id);
      } else if (latest.status === 'failed') {
        clearInterval(pollTimer);
        hideProgress();
        var errMsg = latest.error_msg || latest.error || '执行失败';
        showError(errMsg);
      }
    } catch (e) {
      // Ignore poll errors
    }
  }, 3000);
}

// ── Error display ──
function showError(msg) {
  document.getElementById('errorCard').style.display = 'block';
  document.getElementById('errorMsg').textContent = msg;
  document.getElementById('execBtn').disabled = false;
}

// ── Result display ──
async function showResult(runId) {
  document.getElementById('resultCard').style.display = 'block';
  document.getElementById('execBtn').disabled = false;
  currentRunId = runId;

  try {
    var res = await fetch('/api/reports/runs/' + runId, {
      headers: { 'Authorization': getAuthHeader() }
    });
    var run = await res.json();

    // Header
    var statusClass = run.status === 'completed' ? 'success' : 'error';
    var statusText = run.status === 'completed' ? '✓ 执行完成' : '✗ 执行失败';
    var header = '<div class="result-status ' + statusClass + '">' + statusText + '</div>';
    header += '<div class="result-meta">涉及 <strong>' + (run.fact_count || 0) + '</strong> 条事实 ｜ 耗时 <strong>' + formatDuration(run.duration_sec) + '</strong></div>';
    document.getElementById('resultHeader').innerHTML = header;

    // Markdown
    var mdContent = run.output_analysis || run.result_markdown || '';
    document.getElementById('resultMarkdown').innerHTML = marked.parse(mdContent || '暂无内容');

    // Charts
    if (run.output_charts && run.output_charts.length > 0) {
      renderCharts(run.output_charts, 'resultCharts');
    } else {
      document.getElementById('resultCharts').innerHTML = '';
    }

    // Summary
    var summary = run.output_summary || run.result_summary || '';
    if (summary) {
      document.getElementById('resultSummary').style.display = 'block';
      document.getElementById('resultSummaryText').textContent = summary;
    } else {
      document.getElementById('resultSummary').style.display = 'none';
    }

    document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth' });
    loadOverview();
  } catch (e) {
    showError('加载结果失败: ' + (e.message || ''));
  }
}

function formatDuration(sec) {
  if (!sec) return '-';
  if (sec < 60) return sec + '秒';
  var m = Math.floor(sec / 60);
  var s = sec % 60;
  return m + '分' + s + '秒';
}

// ── Charts ──
function renderCharts(charts, containerId) {
  var container = document.getElementById(containerId);
  container.innerHTML = '';
  charts.forEach(function(chart, idx) {
    var div = document.createElement('div');
    div.className = 'chart-container';
    div.innerHTML = '<div class="chart-header"><span>' + (chart.title || '') + '</span><span class="chart-type ' + (chart.type || 'bar') + '">' + (chart.type || 'bar') + '</span></div><div class="chart-body" id="chart-' + idx + '"></div>';
    container.appendChild(div);
    var instance = echarts.init(document.getElementById('chart-' + idx));
    instance.setOption({
      tooltip: { trigger: 'axis' },
      xAxis: { type: 'category', data: (chart.data && chart.data.categories) || [] },
      yAxis: { type: 'value' },
      series: [{ data: (chart.data && chart.data.values) || [], type: chart.type || 'bar', smooth: chart.type === 'line' }],
      grid: { left: 40, right: 20, bottom: 30, top: 10 }
    });
    chartInstances.push(instance);
  });
}

// ── Overview / Recent Reports ──
async function loadOverview() {
  try {
    var res = await fetch('/api/reports/overview', {
      headers: { 'Authorization': getAuthHeader() }
    });
    var list = await res.json();
    renderOverview(list);
  } catch (e) {
    document.getElementById('reportListContainer').innerHTML = '<div class="empty-state">加载失败</div>';
  }
}

function renderOverview(list) {
  var container = document.getElementById('reportListContainer');
  if (!list || list.length === 0) {
    container.innerHTML = '<div class="empty-state">暂无报告模板</div>';
    return;
  }
  var html = '<div class="report-list">';
  list.forEach(function(item) {
    var title = item.name || '未命名';
    var time = item.last_time ? item.last_time.slice(0, 16) : '-';
    var statusClass = item.last_status === 'completed' ? 'completed' : (item.last_status === 'failed' ? 'failed' : (item.last_status === 'running' ? 'running' : 'pending'));
    var duration = item.last_duration ? formatDuration(item.last_duration) : '-';
    html += '<div class="report-item" onclick="viewTemplateReports(' + item.template_id + ')">';
    html += '<span class="report-title">' + escapeHtml(title) + '</span>';
    html += '<div class="report-meta">';
    html += '<span class="status-badge ' + statusClass + '">' + (item.last_status || '-') + '</span>';
    html += '<span>' + time + '</span>';
    html += '<span>' + duration + '</span>';
    html += '</div>';
    html += '</div>';
  });
  html += '</div>';
  container.innerHTML = html;
}

async function viewTemplateReports(templateId) {
  try {
    var res = await fetch('/api/reports/runs/' + templateId + '?limit=5', {
      headers: { 'Authorization': getAuthHeader() }
    });
    var data = await res.json();
    if (!data.runs || data.runs.length === 0) {
      alert('该模板暂无执行记录');
      return;
    }
    // Open the latest run
    showResult(data.runs[0].id);
  } catch (e) {
    alert('加载失败: ' + (e.message || ''));
  }
}
</script>
</body>
</html>
