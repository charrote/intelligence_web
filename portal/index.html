<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>情报列表</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script src="js/qrcode.min.js"></script>
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/sidebar.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
<script src="js/dom.js"></script>
<script src="js/auth.js"></script>
<!-- <script src="js/init.js"></script> -->
<script src="js/tabs.js"></script>
<style>
.feed{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:stretch;background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);cursor:pointer;transition:all 0.15s}
.row:hover{border-color:var(--accent);background:var(--gray-50)}
.row-index{width:36px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--gray-400);flex-shrink:0}
.row-body{flex:1;padding:12px 16px 12px 0;overflow:hidden;display:flex;flex-direction:column;gap:6px}
.row-title{font-size:14px;font-weight:500;color:var(--gray-800);line-height:1.5}
.row-title.read{color:var(--gray-400)}
.row-meta{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--gray-400);flex-wrap:wrap}
.row-meta .tag{display:inline-flex;padding:1px 6px;border-radius:2px;font-size:11px;font-weight:500;color:var(--gray-600);background:var(--gray-100)}
.row-meta .tag-company{color:var(--accent);background:var(--accent-light)}
.row-meta .deal{color:var(--green);font-weight:500}
.stat-num.gold{color:var(--amber)}.stat-num.green{color:var(--green)}.stat-num.accent{color:var(--accent)}.stat-num.blue{color:var(--blue)}
.pager{display:flex;align-items:center;justify-content:center;gap:6px;margin:20px 0 8px;flex-wrap:wrap}
.pg-info{font-size:12px;color:var(--gray-400);margin-right:8px}
.pg-btn{min-width:30px;height:30px;padding:0 8px;border:1px solid var(--gray-200);background:#fff;border-radius:4px;font-size:13px;color:var(--gray-600);cursor:pointer;line-height:28px;text-align:center}
.pg-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.pg-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.pg-btn:disabled{opacity:.4;cursor:not-allowed}
.pg-dots{color:var(--gray-400);padding:0 2px}
#sidebarCats{}
/* ── Share modal ── */
.share-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:none;align-items:center;justify-content:center;padding:16px}
.share-modal-overlay.open{display:flex}
.share-modal{background:#fff;border-radius:12px;width:100%;max-width:360px;max-height:88vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.share-modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--gray-200)}
.share-modal-head h3{font-size:15px;font-weight:600;color:var(--gray-800)}
.share-modal-body{padding:16px 18px}
.share-label{font-size:12px;color:var(--gray-400);margin:0 0 8px;font-weight:600}
.share-label + .share-link-row, .share-label + .share-poster-wrap{margin-top:0}
.share-link-row{display:flex;align-items:center;gap:8px;background:var(--gray-50);border:1px solid var(--gray-200);border-radius:8px;padding:9px 12px}
.share-link-row .txt{flex:1;font-size:12px;color:var(--gray-600);word-break:break-all;line-height:1.5}
.share-poster-wrap{border:1px solid var(--gray-200);border-radius:8px;overflow:hidden;background:#F5F6F8}
.share-poster-wrap canvas{width:100%;height:auto;display:block}
.share-actions{display:flex;gap:8px;margin-top:16px}
.share-actions .btn{flex:1}
.share-tip{font-size:11px;color:var(--gray-400);margin-top:12px;text-align:center;line-height:1.6}
.share-meta{font-size:12px;color:var(--gray-500);margin-top:8px;line-height:1.5}
.share-expiry{width:100%;box-sizing:border-box;padding:8px 12px;border:1px solid var(--gray-200);border-radius:8px;font-size:13px;color:var(--gray-700);background:#fff;outline:none;cursor:pointer}
.share-expiry:focus{border-color:var(--accent)}
/* ── 批量分享（多选 → 长海报）── */
.row-check{width:34px;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding-top:12px}
.row-check input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}
.row-check:empty{display:none}
.batch-item{display:flex;gap:8px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--gray-100);font-size:13px;color:var(--gray-700)}
.batch-item .no{color:var(--gray-400);font-size:12px;flex-shrink:0}
.batch-item .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 分享选择模式：点「分享」进入，此时点条目=选择（不打开详情）；选择指示点 + 选中行高亮 + 选择态按钮 + 提示条 */
.sel-dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--gray-300);display:inline-block;box-sizing:border-box;position:relative}
.sel-dot.on{background:var(--accent);border-color:var(--accent)}
.sel-dot.on::after{content:"";position:absolute;left:5px;top:2px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.row.selected{border-color:var(--accent);background:var(--accent-light)}
.btn-sm.active{background:var(--accent);border-color:var(--accent);color:#fff}
.select-mode-banner{font-size:12px;color:var(--accent);background:var(--accent-light);border:1px solid var(--accent);border-radius:6px;padding:6px 12px;margin:0 0 8px;display:none;align-items:center;gap:6px;line-height:1.5}
.select-mode-banner.show{display:flex}
/* ── 下拉刷新（移动端）── */
#pullRefresh{height:0;overflow:hidden}
.pr-inner{display:flex;align-items:center;justify-content:center;gap:6px;height:48px;font-size:12px;color:var(--gray-400)}
.pr-icon{width:16px;height:16px;flex-shrink:0;transition:transform .15s ease}
#pullRefresh.ready .pr-text{color:var(--accent)}
#pullRefresh.refreshing .pr-icon{animation:pr-spin 1s linear infinite}
@keyframes pr-spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main class="main">
  <div id="pullRefresh"><div class="pr-inner">
    <svg class="pr-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
    <span class="pr-text">下拉刷新</span>
  </div></div>
  <div class="stats" id="statsRow">
    <div class="stat"><div class="stat-num accent" id="statTotal">-</div><div class="stat-label">全部情报</div></div>
    <div class="stat"><div class="stat-num gold" id="statToday">-</div><div class="stat-label">今日新增</div></div>
    <div class="stat"><div class="stat-num blue" id="statRecent">-</div><div class="stat-label">近7天新增</div></div>
    <div class="stat"><div class="stat-num" id="statStale" style="color:var(--gray-400)">-</div><div class="stat-label">陈旧</div></div>
    <div class="stat"><div class="stat-num green" id="statCats">-</div><div class="stat-label">分类</div></div>
  </div>
  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="搜索情报..." oninput="onFilterChange()">
    <select id="catFilter" onchange="onFilterChange()">
      <option value="">全部分类</option>
    </select>
    <select id="projFilter" onchange="onProjChange()">
      <option value="">全部项目</option>
    </select>
    <button class="btn btn-sm" id="shareModeBtn" onclick="toggleShareSelectMode()" style="display:none;align-items:center;gap:4px">分享</button>
    <button class="btn btn-primary btn-sm" id="batchShareBtn" onclick="openBatchShare()" style="display:none;align-items:center;gap:4px">确认分享</button>
    <span class="spacer"></span>
  </div>
  <div class="select-mode-banner" id="selectModeBanner">选择模式：点按条目选择要分享的情报（最多 5 篇），完成点「确认分享」，再点「取消选择」退出</div>
  <div class="feed" id="feed"></div>
  <div class="pager" id="pager"></div>
</main>
<div class="panel" id="detailPanel">
  <div class="panel-head"><h2 id="panelTitle">详情</h2><button class="panel-close" onclick="closePanel()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
  <div class="panel-body" id="panelBody"></div>
  <div class="panel-foot" id="panelFoot"></div>
</div>
<div class="panel-overlay" onclick="closePanel()"></div>
<!-- 分享弹窗 -->
<div class="share-modal-overlay" id="shareModal">
  <div class="share-modal">
    <div class="share-modal-head">
      <h3>分享情报</h3>
      <button class="panel-close" onclick="closeShare()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="share-modal-body">
      <div class="share-label">分享链接</div>
      <div class="share-link-row">
        <span class="txt" id="shareLinkText">加载中…</span>
        <button class="btn btn-primary btn-sm" onclick="copyShareLink()">复制</button>
      </div>
      <div class="share-meta" id="shareMeta"></div>
      <div class="share-label" style="margin-top:16px">链接有效期</div>
      <select class="share-expiry" id="shareExpiry" onchange="onExpiryChange()">
        <option value="7">7 天</option>
        <option value="30" selected>30 天</option>
        <option value="90">90 天</option>
      </select>
      <div class="share-label" style="margin-top:16px">分享海报（朋友圈）</div>
      <div class="share-poster-wrap"><canvas id="sharePoster"></canvas></div>
      <div class="share-actions">
        <button class="btn btn-primary" id="posterBtn" onclick="downloadPoster()">分享海报</button>
        <button class="btn btn-ghost" id="weiboBtn" onclick="shareToWeibo()">分享到微博</button>
      </div>
      <div class="share-tip">点「分享海报」选微信等 App 直接发送，或保存海报发朋友圈<br>外链展示标题与摘要，注册后可查看全文</div>
    </div>
  </div>
</div>
<!-- 批量分享弹窗（多选 → 长海报） -->
<div class="share-modal-overlay" id="batchShareModal">
  <div class="share-modal" style="max-width:400px">
    <div class="share-modal-head">
      <h3 id="batchShareTitle">批量分享情报</h3>
      <button class="panel-close" onclick="closeBatchShare()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="share-modal-body">
      <div id="batchShareList" style="max-height:140px;overflow:auto"></div>
      <div class="share-label" style="margin-top:16px">拼接长海报（每篇含全文）</div>
      <div class="share-poster-wrap"><canvas id="batchPoster"></canvas></div>
      <div class="share-actions">
        <button class="btn btn-primary" id="batchPosterBtn" onclick="downloadBatchPoster()">分享长海报</button>
      </div>
      <div class="share-tip">最多支持 5 篇 · 每篇展示全文（不含来源）拼接为一张长海报<br>点「分享长海报」选微信等 App 直接发送，或保存后发朋友圈 / 微信群</div>
    </div>
  </div>
</div>
<script>
console.log("[TEST] Script loaded");
var currentIntel = null;
var PAGE_VERSION = 'v109c';  // 页面版本标识（刷新 toast / console 展示，便于确认设备跑的是哪版）
var allItems = [];
var currentPage = 1;       // 当前页码（1 起）
var PAGE_SIZE = 20;        // 每页条数
var currentFiltered = [];  // 当前筛选后的全量列表（翻页用）
var domainConfig = null, statusMap = {};
var domainPort = parseInt(window.location.port) || (location.protocol === 'https:' ? 443 : 80);
var allProjects = [];
var isAdmin = (getUser() && getUser().role === 'admin');

function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c];
  });
}

// 稳健时间解析：created_at 是微秒精度无时区（2026-07-22T04:22:38.690408），
// Safari 对带微秒的非标准 ISO 会返回 NaN → 截断到秒后解析，全浏览器可用
function parseDate(iso) {
  if (!iso) return null;
  var s = String(iso).replace(/(\.\d+).*/, '').replace(' ', 'T');
  var d = new Date(s);
  return isNaN(d) ? null : d;
}

function renderMarkdown(text) {
  if (!text) return '';
  var html;
  try {
    html = marked.parse(text);
    if (typeof DOMPurify !== 'undefined') {
      html = DOMPurify.sanitize(html);
    }
  } catch(e) {
    console.warn('[renderMarkdown] parse error:', e);
    return escapeHtml(text);
  }
  // 情报正文里的超链接一律标为外部链接（data-ext）——
  // 由全局外链守卫拦截：弹提示 → 新标签页打开，绝不在系统内导航。
  var tmp = document.createElement('div');
  tmp.innerHTML = html;
  // 段落首行缩进统一为 2em（CSS .detail-content p）：
  // LLM 产出的正文里部分段落带 2~3 个前导空格（HTML 渲染会保留 1 个空格），
  // 造成"有些段落缩进、有些没有"的参差——这里把 <p> 开头的前导空白剥掉。
  var ps = tmp.querySelectorAll('p');
  for (var pi = 0; pi < ps.length; pi++) {
    var p = ps[pi];
    while (p.firstChild && p.firstChild.nodeType === 3) {
      p.firstChild.textContent = p.firstChild.textContent.replace(/^\s+/, '');
      if (p.firstChild.textContent) break;
      p.removeChild(p.firstChild);
    }
  }
  var links = tmp.querySelectorAll('a[href]');
  for (var i = 0; i < links.length; i++) {
    var a = links[i];
    var href = a.getAttribute('href');
    // 只拦截真正的网址链接；锚点(#)、mailto/tel 交给浏览器默认处理
    if (!href || href.charAt(0) === '#') continue;
    if (/^(mailto:|tel:)/i.test(href)) continue;
    a.setAttribute('data-ext', '1');
    a.removeAttribute('target'); // 新标签页统一由守卫 window.open 控制
  }
  return tmp.innerHTML;
}

function closePanel(){document.getElementById('detailPanel').classList.remove('open');currentIntel=null;applyFilters()}

async function init() {
  console.log('[PWA] 情报列表页面版本: ' + PAGE_VERSION);
  initExternalLinkGuard(); // 情报详情超链接 → 弹提示 + 新标签页打开，不在系统内导航
  await loadDomainConfig();
  await loadProjectsList();
  await loadData();
  render();
  buildSidebarCats();
  updateShareButtons();
  // 聚焦消费：从工作台跳转来，定位到指定情报详情
  var focusId = localStorage.getItem('qm_open_intel');
  if (focusId) {
    localStorage.removeItem('qm_open_intel');
    openDetail(parseInt(focusId));
  }
}

async function loadProjectsList() {
  try {
    var r = await apiFetch(APP_API_BASE + '/api/projects?status=active');
    var d = await r.json();
    allProjects = d.items || [];
    var sel = document.getElementById('projFilter');
    if (sel) {
      allProjects.forEach(function(p) {
        var o = document.createElement('option');
        o.value = p.id;
        o.textContent = p.name + (p.target_name ? ' — ' + p.target_name : '');
        sel.appendChild(o);
      });
    }
  } catch(e) { /* projects loading is non-critical */ }
}

async function loadDomainConfig() {
  try {
    var res = await apiFetch(APP_API_BASE + '/api/domain_config');
    var data = await res.json();
    domainConfig = data;
    if (data.statuses) {
      data.statuses.forEach(function(s) { statusMap[s.key || s[0]] = s.label || s[1]; });
    }
  } catch(e) { statusMap = {pending:'待处理',active:'处理中',done:'已完成'}; }
}

async function loadData() {
  try {
    var projFilter = document.getElementById('projFilter')?.value || '';
    var url = APP_API_BASE + '/api/intelligence?limit=500';
    if (projFilter) url += '&project_id=' + projFilter;
    var r = await apiFetch(url); var d = await r.json(); allItems = Array.isArray(d) ? d : (d.items || []); console.log('[DATA] loaded', allItems.length, 'items');
  } catch(e) { console.log('[DATA] error:', e); allItems = []; }
}

function buildSidebarCats() {
  var list = document.getElementById('sidebarCats'); if (!list) return;
  list.innerHTML = '';
  var cats = [];
  for (var i = 0; i < allItems.length; i++) { if (allItems[i].category && cats.indexOf(allItems[i].category) === -1) cats.push(allItems[i].category); }
  cats.slice(0,12).forEach(function(c) {
    var d=document.createElement('div'); d.className='sidebar-item'; d.innerHTML='<span class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></span>'+escapeHtml(c);
    d.onclick=function(){document.getElementById('catFilter').value=c;onFilterChange()};
    list.appendChild(d);
  });
}

function render() {
  var t=allItems.length;
  // 自然日口径：00:00 起算，跨零点后旧条目不再计入
  var start=new Date(); start.setHours(0,0,0,0);
  var today=allItems.filter(function(i){var d=parseDate(i.created_at);return d&&d.getTime()>=start.getTime()}).length;
  var now=Date.now(), W=7*86400000;
  var recent=allItems.filter(function(i){var d=parseDate(i.created_at);return d&&(now-d.getTime())<W}).length;
  var stale=allItems.filter(function(i){return i.is_expired===1||i.is_expired===true}).length;
  var catset={};allItems.forEach(function(i){if(i.category)catset[i.category]=1});
  document.getElementById('statTotal').textContent=t;
  document.getElementById('statToday').textContent=today;
  document.getElementById('statRecent').textContent=recent;
  var stEl=document.getElementById('statStale'); if(stEl) stEl.textContent=stale;
  document.getElementById('statCats').textContent=Object.keys(catset).length;
  // 状态维度已对用户隐藏，不再渲染状态筛选
  var cs=document.getElementById('catFilter'); var cats=[]; for(var i=0;i<allItems.length;i++){if(allItems[i].category&&cats.indexOf(allItems[i].category)===-1)cats.push(allItems[i].category)}
  cs.innerHTML='<option value="">全部分类</option>'; cats.forEach(function(c){var o=document.createElement('option');o.value=c;o.textContent=c;cs.appendChild(o)});
  applyFilters();
}

// 纯筛选+渲染当前页：按当前 UI 状态（搜索/分类）过滤 allItems，渲染 currentPage。
// 不重置页码——供详情标记已读后刷新标题色用（保持当前页）。
function applyFilters() {
  var s=document.getElementById('searchInput').value.toLowerCase();
  var cat=document.getElementById('catFilter').value;
  var items=allItems;
  if(s)items=items.filter(function(i){return (i.title||'').toLowerCase().includes(s)||(i.content||'').toLowerCase().includes(s)});
  if(cat)items=items.filter(function(i){return i.category===cat});
  currentFiltered=items;
  renderFeed(items);
}

// 筛选条件变化（搜索/分类）：回第一页再渲染
function onFilterChange(){currentPage=1;applyFilters();}

// 项目筛选是服务端过滤：重载数据后回第一页再渲染
async function onProjChange(){currentPage=1;await loadData();applyFilters();}

function renderFeed(items) {
  var feed=document.getElementById('feed');
  var total=items.length;
  var totalPages=Math.max(1,Math.ceil(total/PAGE_SIZE));
  if(currentPage>totalPages)currentPage=totalPages;
  if(currentPage<1)currentPage=1;
  var start=(currentPage-1)*PAGE_SIZE;
  var pageItems=items.slice(start,start+PAGE_SIZE);
  if(!total){
    feed.innerHTML='<div style="padding:40px;text-align:center;color:var(--gray-400);font-size:13px;">暂无匹配的情报</div>';
    renderPager(0);
    updateShareButtons();
    return;
  }
  feed.innerHTML=pageItems.map(function(item,pi){
    var gi=start+pi;   // 全局连续编号（跨页不重排）
    var co=escapeHtml(item.company||''), de=item.deal_value?(item.deal_value>10000?'¥'+(item.deal_value/10000).toFixed(0)+'万':'¥'+item.deal_value):'';
    var ents=(item.entities||[]).map(function(e){return '<span class="tag" style="background:#f0e6ff;color:#722ed1">'+escapeHtml(e)+'</span>'}).join('');
    var projTag='';
    if(item.project_id){
      var proj=allProjects.find(function(p){return p.id==item.project_id});

// 分页控制条：上一页 / 页码（窗口化+省略号）/ 下一页
function renderPager(total) {
  var el=document.getElementById('pager'); if(!el)return;
  if(!total){el.innerHTML='';return;}
  var totalPages=Math.ceil(total/PAGE_SIZE);
  var from=(currentPage-1)*PAGE_SIZE+1, to=Math.min(currentPage*PAGE_SIZE,total);
  var h='<span class="pg-info">第 '+from+'–'+to+' 条 / 共 '+total+' 条</span>';
  h+='<button class="pg-btn" '+(currentPage<=1?'disabled':'')+' onclick="goToPage('+(currentPage-1)+')">&laquo;</button>';
  h+=pageButtons(totalPages);
  h+='<button class="pg-btn" '+(currentPage>=totalPages?'disabled':'')+' onclick="goToPage('+(currentPage+1)+')">&raquo;</button>';
  el.innerHTML=h;
}

// 窗口化页码：始终显示首尾页，当前页前后各 2，溢出用省略号
function pageButtons(totalPages) {
  var cur=currentPage;
  if(totalPages<=7){
    var all='';
    for(var i=1;i<=totalPages;i++) all+='<button class="pg-btn'+(i===cur?' active':'')+'" onclick="goToPage('+i+')">'+i+'</button>';
    return all;
  }
  var start=Math.max(1,cur-2), end=Math.min(totalPages,start+4);
  if(end-start<4){start=Math.max(1,end-4);}
  var h='';
  if(start>1){
    h+='<button class="pg-btn" onclick="goToPage(1)">1</button>';
    if(start>2) h+='<span class="pg-dots">…</span>';
  }
  for(var i=start;i<=end;i++) h+='<button class="pg-btn'+(i===cur?' active':'')+'" onclick="goToPage('+i+')">'+i+'</button>';
  if(end<totalPages){
    if(end<totalPages-1) h+='<span class="pg-dots">…</span>';
    h+='<button class="pg-btn" onclick="goToPage('+totalPages+')">'+totalPages+'</button>';
  }
  return h;
}

function goToPage(n){
  var totalPages=Math.max(1,Math.ceil((currentFiltered.length||0)/PAGE_SIZE));
  if(n<1||n>totalPages)return;
  currentPage=n;
  renderFeed(currentFiltered);
  var f=document.getElementById('feed'); if(f)f.scrollIntoView({behavior:'smooth',block:'start'});
}

// 按最大宽度折行（中文按字断行），返回行数组；超过 maxLines 截断加省略号
function splitLines(ctx, text, maxW, maxLines) {
  var lines = [], line = '';
  for (var i = 0; i < text.length; i++) {
    var ch = text[i];
    if (ch === '\n') { lines.push(line); line = ''; continue; }
    if (line && ctx.measureText(line + ch).width > maxW) { lines.push(line); line = ch; }
    else line += ch;
  }
  if (line) lines.push(line);
  if (maxLines && lines.length > maxLines) {
    lines = lines.slice(0, maxLines);
    lines[maxLines - 1] = lines[maxLines - 1].replace(/.{1,2}$/, '…');
  }
  return lines;
}

// 逐行绘制（基线从 y 起，行距 lineH），返回绘制行数
function drawLines(ctx, lines, x, y, lineH) {
  for (var j = 0; j < lines.length; j++) ctx.fillText(lines[j], x, y + j * lineH);
  return lines.length;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

// 海报排版：先量后画（两遍排版），高度随内容自适应。
//  - 短内容：余量垫在正文与 CTA 之间，CTA / 二维码 / 页脚贴底，不再留大片空白；
//  - 长内容：画布按内容加长，二维码与页脚不会像固定 1180 高那样叠在一起；
//  - 预览：不写 canvas.style 尺寸，交给 .share-poster-wrap canvas{width:100%} 等比缩放，
//    弹窗里看到的是完整海报，而不是被裁掉的左半边。
function renderPoster(intel, url) {
  var canvas = document.getElementById('sharePoster');
  var W = 750, PAD = 48;
  var x = PAD + 36, cw = W - PAD*2 - 72;   // 内容左边界 / 内容宽
  var MIN_H = 820, MAX_H = 20000, GAP_FOOTER = 56, QR = 180;
  var ctx = canvas.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);

  // 字体：排版与绘制共用，保证量出来的行数和画出来的一致
  var F_TITLE = '700 30px sans-serif', F_TAG = '500 15px sans-serif';
  var F_BODY = '400 19px sans-serif', F_CTA_H = '700 24px sans-serif';
  var F_CTA = '400 17px sans-serif', F_QR_H = '600 20px sans-serif';
  var F_QR = '400 16px sans-serif', F_FOOT = '400 14px sans-serif';
  var CTA_TEXT = '注册后，每日自动采集 1200+ 条竞品/商机情报，追踪 5 大行业，分析师每日推送。';

  var body = (intel.content || '').replace(/[#*`>\-\[\]()!]/g, '').replace(/\n+/g, '\n').trim();
  var bodyText = body;   // 全文上海报（产品口径：分享出去的内容不截断）
  var titleText = (intel.title || '').slice(0, 60);
  var dateStr = (intel.created_at || '').slice(0, 10);
  var host = location.host || 'intelligence.nat.ywapi.com';
  var tags = [];
  if (intel.category) tags.push(intel.category);
  if (intel.company) tags.push(intel.company);
  tags.push(dateStr);

  // ── 第一遍：离屏量高
  var m = document.createElement('canvas').getContext('2d');
  m.font = F_TITLE; var titleLines = splitLines(m, titleText, cw, 3);
  m.font = F_BODY;  var bodyLines  = splitLines(m, indentParagraphs(bodyText), cw, 0);   // 不限行数，全文排版（段落首行缩进 2 字符）
  m.font = F_CTA;   var ctaLines   = splitLines(m, CTA_TEXT, cw, 3);

  // 极端内容保险：总高超过 MAX_H 时裁掉放不下的正文行（末行加省略号）。
  // 正常情报（几千字以内）不会触到；只防超长内容把画布撑爆导出空白。
  var fixedH = 210 + titleLines.length * 44 + 18 + 40 + 24 + 36 + 34 + ctaLines.length * 28 + 34 + QR;
  var maxBodyLines = Math.floor((MAX_H - GAP_FOOTER - PAD - fixedH) / 32);
  if (bodyLines.length > maxBodyLines) {
    bodyLines = bodyLines.slice(0, maxBodyLines);
    bodyLines[maxBodyLines - 1] = bodyLines[maxBodyLines - 1].replace(/.{1,2}$/, '…');
  }

  var y = 210;                                  // 标题首行基线
  y += titleLines.length * 44 + 18;
  var tagsY = y; y += 40;
  y += bodyLines.length * 32 + 24;
  var dividerY = y; y += 36;
  var ctaY = y; y += 34 + ctaLines.length * 28 + 34;
  var qrY = y;
  var contentEnd = qrY + QR;
  // 短内容的留白分两处各半垫开（正文↔CTA、CTA↔二维码），上限 140px：
  // 全垫在一处会在海报中间开一个大洞，视觉重心下沉。
  var slack = Math.min(Math.max(0, MIN_H - (contentEnd + GAP_FOOTER + PAD)), 80);
  var slackTop = Math.round(slack / 2);
  dividerY += slackTop; ctaY += slackTop; qrY += slack; contentEnd += slack;
  var H = Math.min(Math.max(contentEnd + GAP_FOOTER + PAD, MIN_H), MAX_H);

  // 导出安全：① iOS Safari 画布面积上限约 16M px²，超了导出空白；
  // ② 多数安卓 GPU 单维度上限 4096，超了 toBlob 回调可能永不触发（分享「点了没反应」）。
  // dpr 同时按面积与单维度收紧（允许低于 1：长海报宁可略糊，不能导不出）。
  var MAX_AREA = 16000000, MAX_DIM = 4096;
  dpr = Math.min(dpr, Math.sqrt(MAX_AREA / (W * H)), MAX_DIM / W, MAX_DIM / H);

  // ── 第二遍：按最终尺寸绘制
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // 背景 + 白色主卡
  ctx.fillStyle = '#F5F6F8'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff';
  roundRect(ctx, PAD, PAD, W - PAD*2, H - PAD*2, 20); ctx.fill();

  // 品牌
  ctx.fillStyle = '#3B82F6';
  roundRect(ctx, x, 88, 52, 52, 12); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = '700 26px sans-serif';
  ctx.textBaseline = 'middle'; ctx.fillText('情', x + 14, 116);
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#1F2937'; ctx.font = '600 24px sans-serif';
  ctx.fillText('业务情报社', x + 68, 112);
  ctx.fillStyle = '#9CA3AF'; ctx.font = '400 16px sans-serif';
  ctx.fillText('每日自动采集 · 行业情报', x + 68, 138);

  // 标题
  ctx.fillStyle = '#1F2937'; ctx.font = F_TITLE;
  drawLines(ctx, titleLines, x, 210, 44);

  // meta tags（一行放不下就丢弃，不再画出卡片外）
  ctx.font = F_TAG;
  var tagX = x;
  for (var ti = 0; ti < tags.length; ti++) {
    var tw = ctx.measureText(tags[ti]).width + 22;
    if (tagX + tw > x + cw) break;
    ctx.fillStyle = '#EEF0F3';
    roundRect(ctx, tagX, tagsY - 16, tw, 30, 6); ctx.fill();
    ctx.fillStyle = ti === 0 ? '#722ED1' : '#4B5563';
    ctx.fillText(tags[ti], tagX + 11, tagsY + 4);
    tagX += tw + 10;
  }

  // 正文
  ctx.fillStyle = '#4B5563'; ctx.font = F_BODY;
  drawLines(ctx, bodyLines, x, tagsY + 40, 32);

  // 分隔线
  ctx.strokeStyle = '#E5E7EB'; ctx.setLineDash([4,4]); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x, dividerY); ctx.lineTo(x + cw, dividerY); ctx.stroke();
  ctx.setLineDash([]);

  // CTA
  ctx.fillStyle = '#1F2937'; ctx.font = F_CTA_H;
  ctx.fillText('想看更多情报？', x, ctaY);
  ctx.fillStyle = '#4B5563'; ctx.font = F_CTA;
  drawLines(ctx, ctaLines, x, ctaY + 34, 28);

  // 二维码 + 引导文案 + 站点地址（二维码异步生成，统一在 finish() 收尾后才允许下载）
  var qrX = x;
  // 先画二维码白底框，二维码位图随后叠上去。
  // 顺序不能反：白框在 drawImage 之后画会把整个码盖成一块白（历史 bug）。
  ctx.fillStyle = '#fff';
  roundRect(ctx, qrX - 8, qrY - 8, QR + 16, QR + 16, 12); ctx.fill();
  ctx.strokeStyle = '#D6E4FF'; ctx.lineWidth = 1;
  roundRect(ctx, qrX - 8, qrY - 8, QR + 16, QR + 16, 12); ctx.stroke();
  var finish = function (qrOk) {
    if (!qrOk) {
      // 二维码库没加载成功：画明确提示，绝不留一个能骗过眼睛的空白框
      ctx.fillStyle = '#9CA3AF'; ctx.font = '400 15px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('二维码生成失败', qrX + QR/2, qrY + QR/2);
      ctx.textAlign = 'left';
    }
    var tx = qrX + QR + 28;
    ctx.fillStyle = '#1F2937'; ctx.font = F_QR_H;
    ctx.fillText('业务情报社', tx, qrY + 26);
    ctx.fillStyle = '#4B5563'; ctx.font = F_QR;
    drawLines(ctx, ['长按识别二维码', '在微信内直接打开本页'], tx, qrY + 58, 24);
    ctx.fillStyle = '#9CA3AF';
    ctx.fillText('或浏览器访问', tx, qrY + 118);
    ctx.fillStyle = '#3B82F6'; ctx.font = '600 16px sans-serif';
    ctx.fillText(host, tx, qrY + 144);
    // 页脚（贴卡片底部，与二维码块不再重叠）
    ctx.fillStyle = '#9CA3AF'; ctx.font = F_FOOT; ctx.textAlign = 'center';
    ctx.fillText('本情报由 业务情报社 自动采集生成 · 内容仅供参考', W/2, H - PAD - 24);
    ctx.textAlign = 'left';
    shareState.posterReady = true;
    var btn = document.getElementById('posterBtn');
    if (btn) { btn.disabled = false; btn.style.opacity = ''; }
  };
  if (typeof QRCode !== 'undefined' && QRCode.toCanvas) {
    var qrCanvas = document.createElement('canvas');
    // 位图按 dpr 生成再缩到逻辑尺寸：导出 2x 海报时二维码边缘不糊
    QRCode.toCanvas(qrCanvas, url, { width: QR * dpr, margin: 1, color: { dark: '#1F2937', light: '#ffffff' } }, function(err) {
      if (!err) ctx.drawImage(qrCanvas, qrX, qrY, QR, QR);
      else console.warn('[renderPoster] 二维码生成失败:', err);
      finish(!err);
    });
  } else {
    console.warn('[renderPoster] QRCode 库未加载');
    finish(false);
  }
}

function posterFilename() {
  return '情报分享_' + (currentIntel ? currentIntel.id : 'intel') + '.png';
}

// 回退路径：浏览器不支持系统分享（桌面端 / 非 HTTPS 环境）时直接下载图片
// 下载成功必须明确告知用户（失败不能无声）
function downloadPosterFile(canvas, filename) {
  try {
    var a = document.createElement('a');
    a.download = filename || posterFilename();
    a.href = canvas.toDataURL('image/png');
    a.click();
    toast('海报已保存，可在手机「文件 / 相册」里找到并转发到微信', 4000);
  } catch(e) { alert('海报下载失败：' + e); }
}

// 系统分享不可用 / 失败时的明确提示（带原因码，便于用户回报定位）
function shareDiag(msg) {
  toast(msg, 5000);
}

// 把超限画布等比缩小到 maxDim×maxDim 以内（多数设备单维度上限 4096），
// 长海报直接导出失败时兜底用：宁可略糊，也要给用户一张能发出去的图
function scaleCanvasFit(canvas, maxDim) {
  var w = canvas.width, h = canvas.height;
  var scale = Math.min(1, maxDim / w, maxDim / h);
  if (scale >= 1) return canvas;
  var out = document.createElement('canvas');
  out.width = Math.max(1, Math.round(w * scale));
  out.height = Math.max(1, Math.round(h * scale));
  out.getContext('2d').drawImage(canvas, 0, 0, out.width, out.height);
  return out;
}

// 通用：海报画布 → 系统分享面板（可选微信等 App 直接发送）；不支持/异常回退为下载，并逐分支给出明确提示
// 单篇分享与批量长海报共用，保证「生成海报 → 系统分享 → 到 App」路径一致
// 关键：任何分支都必须有可见反馈，绝不静默（此前批量长海报 toBlob 回调不来时点了毫无反应）：
//  · toBlob 1.5s 内无回调 → 先提示「生成中」（长海报 PNG 导出较慢，避免用户以为点没点上）
//  · toBlob 回调始终不来（设备画布尺寸超限）→ 15s 强制兜底：缩小画布后下载
//  · toBlob 同步抛异常（如画布被跨域污染）→ 提示并下载
function shareCanvasPoster(canvas, filename, title, text) {
  var done = false, tipTimer = null, hardTimer = null;
  function stopTimers() {
    if (tipTimer) { clearTimeout(tipTimer); tipTimer = null; }
    if (hardTimer) { clearTimeout(hardTimer); hardTimer = null; }
  }
  function fb(reason, srcCanvas) {
    if (done) return;
    done = true;
    stopTimers();
    if (reason) shareDiag(reason);
    downloadPosterFile(srcCanvas || canvas, filename);
  }
  // ① 非 HTTPS（非安全上下文）：浏览器根本不暴露 navigator.share
  if (!window.isSecureContext) {
    fb('当前是 HTTP 入口，浏览器无法打开系统分享面板，已改为下载海报。请从手机桌面「业务情报社」图标（HTTPS）进入。原因：非HTTPS入口 [NOT_SECURE_CONTEXT]');
    return;
  }
  // ② 浏览器不支持 Web Share API（桌面浏览器 / 微信内置浏览器 / 部分国产浏览器）
  if (!navigator.share) {
    fb('当前浏览器不支持系统分享面板（微信内置浏览器、部分手机自带浏览器常见），已改为下载海报。原因：浏览器不支持 [SHARE_API_MISSING]');
    return;
  }
  // ③ 导出等待期反馈
  tipTimer = setTimeout(function() {
    if (!done) toast('分享图片生成中，长海报导出较慢，请稍候…', 5000);
  }, 1500);
  hardTimer = setTimeout(function() {
    fb('分享图片导出超时，已自动缩小海报并保存，可在「文件 / 相册」里转发。原因：导出超时 [TOBLOB_TIMEOUT]');
  }, 15000);
  try {
    canvas.toBlob(function(blob) {
      if (done) return;   // 超时兜底已处理，不再重复动作
      stopTimers();       // 导出完成，清除等待期定时器
      if (!blob) { fb('海报图片生成失败，请重试。原因：图片转换失败 [BLOB_NULL]'); return; }
      var file = new File([blob], filename, { type: 'image/png' });
      var ok = true;
      if (navigator.canShare) {
        try { ok = navigator.canShare({ files: [file] }); }
        catch(e) { ok = false; }
      }
      if (!ok) {
        fb('当前浏览器不支持分享图片文件，已改为下载海报。原因：不支持发图 [FILE_SHARE_UNSUPPORTED]');
        return;
      }
      try {
        navigator.share({ files: [file], title: title || '情报分享', text: text || '' }).catch(function(err) {
          var name = (err && err.name) || 'Error';
          // 用户取消（AbortError）不算失败，静默；其余异常回退为下载并说明原因
          if (name === 'AbortError') return;
          fb('系统分享被中断（' + name + '），已改为下载海报。若反复出现，刷新页面后再试。原因：系统拒绝 [SHARE_REJECTED]');
        });
      } catch(e) {
        fb('系统分享被中断（' + ((e && e.name) || 'Error') + '），已改为下载海报。若反复出现，刷新页面后再试。原因：系统拒绝 [SHARE_REJECTED]');
      }
    }, 'image/png');
  } catch(e) {
    fb('海报图片生成失败，请重试。原因：图片导出异常 [TOBLOB_THREW]');
  }
}

function downloadPoster() {
  var canvas = document.getElementById('sharePoster');
  if (!canvas || !shareState.url) return;
  if (!shareState.posterReady) { toast('海报生成中，请稍候'); return; }
  shareCanvasPoster(canvas, posterFilename(), (currentIntel && currentIntel.title) || '情报分享', shareState.url);
}

// ── 批量分享：多选（最多 5 篇）→ 拼接一张长海报，每篇展示全文（不显示来源）──
var MAX_BATCH_SHARE = 5;
var shareSelection = [];      // 已勾选的情报 id（可跨页保留）
var shareSelectMode = false;  // 分享选择模式开关：点工具栏「分享」进入，此时点条目=选择而非打开详情
var batchState = { ready: false };

// 行点击分发：选择模式下点行=切换选择（不打开详情），否则打开详情
function onRowClick(id) {
  if (shareSelectMode && canShareIntel()) { toggleSelect(id); return; }
  openDetail(id);
}

// 切换某条情报的选择态（上限 5 篇），就地刷新该行指示点/高亮 + 工具栏按钮，不整页重渲（避免滚动跳变）
function toggleSelect(id) {
  var idx = shareSelection.indexOf(id);
  var on;
  if (idx === -1) {
    if (shareSelection.length >= MAX_BATCH_SHARE) { toast('最多选择 ' + MAX_BATCH_SHARE + ' 篇'); return; }
    shareSelection.push(id); on = true;
  } else {
    shareSelection.splice(idx, 1); on = false;
  }
  var row = document.querySelector('.row[data-id="' + id + '"]');
  if (row) {
    row.classList.toggle('selected', on);
    var dot = row.querySelector('.sel-dot');
    if (dot) dot.classList.toggle('on', on);
  }
  updateShareButtons();
}

// 「分享」按钮：进入/退出选择模式
function toggleShareSelectMode() {
  if (!canShareIntel()) { alert('没有分享权限（需在角色中勾选"开放情报分享"）'); return; }
  shareSelectMode = !shareSelectMode;
  if (shareSelectMode) toast('选择要分享的情报（最多 ' + MAX_BATCH_SHARE + ' 篇）');
  applyFilters();      // 重渲列表：显示/隐藏选择指示点
  updateShareButtons();
}

// 工具栏分享相关按钮 + 选择模式提示条的显隐与文案
function updateShareButtons() {
  var modeBtn = document.getElementById('shareModeBtn');
  var confirmBtn = document.getElementById('batchShareBtn');
  var banner = document.getElementById('selectModeBanner');
  var n = shareSelection.length;
  if (!canShareIntel()) {
    if (modeBtn) modeBtn.style.display = 'none';
    if (confirmBtn) confirmBtn.style.display = 'none';
    if (banner) banner.classList.remove('show');
    return;
  }
  if (banner) banner.classList.toggle('show', shareSelectMode);
  if (modeBtn) {
    modeBtn.style.display = 'inline-flex';
    modeBtn.classList.toggle('active', shareSelectMode);
    modeBtn.innerHTML = shareSelectMode
      ? '取消选择'
      : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>分享';
  }
  if (confirmBtn) {
    if (shareSelectMode && n > 0) {
      confirmBtn.style.display = 'inline-flex';
      confirmBtn.textContent = '确认分享（' + n + '）';
    } else {
      confirmBtn.style.display = 'none';
    }
  }
}

function openBatchShare() {
  if (!canShareIntel()) { alert('没有分享权限（需在角色中勾选"开放情报分享"）'); return; }
  if (!shareSelection.length) { toast('请先在列表勾选要分享的情报'); return; }
  var items = [];
  shareSelection.forEach(function(id) {
    var it = allItems.find(function(i) { return i.id === id; });
    if (it) items.push(it);
  });
  if (!items.length) {
    toast('所选情报已不存在');
    shareSelection = [];
    updateShareButtons();
    return;
  }
  shareSelection = items.map(function(i) { return i.id; });
  document.getElementById('batchShareTitle').textContent = '批量分享情报（' + items.length + ' 篇）';
  document.getElementById('batchShareList').innerHTML = items.map(function(it, idx) {
    return '<div class="batch-item"><span class="no">' + String(idx + 1).padStart(2, '0') + '</span><span class="t">' + escapeHtml(it.title || '') + '</span></div>';
  }).join('');
  document.getElementById('batchShareModal').classList.add('open');
  var pb = document.getElementById('batchPosterBtn');
  if (pb) { pb.disabled = true; pb.style.opacity = '.6'; }
  batchState.ready = false;
  renderBatchPoster(items);
}

function closeBatchShare() { document.getElementById('batchShareModal').classList.remove('open'); updateShareButtons(); }

// 全文清洗：去 Markdown 符号、链接只留文字、图片去掉；
// 段落以换行分隔、逐段清洗后保留（不再压成单行，海报按段落首行缩进渲染）；
// maxChars 传值则截断（单篇摘要用），不传则返回全文（批量长海报用）
function summarizeContent(content, maxChars) {
  var paras = String(content || '').split(/\n+/).map(function(p) {
    return p
      .replace(/!\[[^\]]*\]\([^)]*\)/g, '')
      .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
      .replace(/^[#>\s\-\*]+/gm, '')
      .replace(/[#*`>~_]/g, '')
      .replace(/\s+/g, ' ')
      .trim();
  }).filter(Boolean);
  var t = paras.join('\n');
  if (maxChars && t.length > maxChars) return t.slice(0, maxChars) + '…';
  return t;
}

// 段落首行缩进：每个非空段落首行前补 2 个全角空格（= 2 字符，与详情页 text-indent:2em 一致）
function indentParagraphs(text) {
  return String(text || '').split('\n').map(function(p) {
    return p ? '\u3000\u3000' + p : p;
  }).join('\n');
}

function renderBatchPoster(items) {
  var canvas = document.getElementById('batchPoster');
  var W = 750, PAD = 48;
  var ctx = canvas.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var x = PAD + 36, cw = W - PAD*2 - 72;

  // ── 第一遍：测量各区块行数，算出长海报总高 ──
  canvas.width = W * dpr; canvas.height = 100 * dpr; // 临时尺寸，仅取 ctx 测量
  var blocks = items.map(function(it) {
    ctx.font = '700 26px sans-serif';
    var titleLines = splitLines(ctx, (it.title || '').slice(0, 60), cw - 48, 3);
    ctx.font = '400 17px sans-serif';
    var contentLines = splitLines(ctx, indentParagraphs(summarizeContent(it.content)), cw);
    var h = titleLines.length * 38 + 14 + 44 + contentLines.length * 28 + 20;
    return { it: it, titleLines: titleLines, contentLines: contentLines, h: h };
  });
  var itemsH = 0;
  blocks.forEach(function(b) { itemsH += b.h; });
  itemsH += (items.length - 1) * 28; // 篇间分隔线
  var H = 260 + itemsH + 434; // 头部 260 + 情报区 + 尾部 CTA/二维码（434 保证 slogan 落在二维码框下方）

  // 导出安全（批量长海报高度不设上限，5 篇全文轻松超 6000px）：
  // ① iOS Safari 画布面积上限约 16M px²，超了导出空白；
  // ② 多数安卓 GPU 单维度上限 4096，超了 toBlob 回调可能永不触发（分享「点了没反应」）。
  // dpr 同时按面积与单维度收紧（允许低于 1：长海报宁可略糊，不能导不出）。
  var MAX_AREA = 16000000, MAX_DIM = 4096;
  dpr = Math.min(dpr, Math.sqrt(MAX_AREA / (W * H)), MAX_DIM / W, MAX_DIM / H);

  // ── 第二遍：按实际高度重设 canvas 并绘制 ──
  // 不写 canvas.style 尺寸：交给 .share-poster-wrap canvas{width:100%} 等比缩放，
  // 弹窗里看到完整长海报（位图仍按 750×H×dpr 高清导出）。
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // 背景 + 白色主卡
  ctx.fillStyle = '#F5F6F8'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff';
  roundRect(ctx, PAD, PAD, W - PAD*2, H - PAD*2, 20); ctx.fill();

  // 品牌
  ctx.fillStyle = '#3B82F6';
  roundRect(ctx, x, 88, 52, 52, 12); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = '700 26px sans-serif';
  ctx.textBaseline = 'middle'; ctx.fillText('情', x + 14, 116);
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#1F2937'; ctx.font = '600 24px sans-serif';
  ctx.fillText('业务情报社', x + 68, 112);
  ctx.fillStyle = '#9CA3AF'; ctx.font = '400 16px sans-serif';
  ctx.fillText('每日自动采集 · 行业情报', x + 68, 138);

  // 区块标题 + 日期范围（先按标题字号测宽，再切小字号排日期，避免叠字）
  var dates = items.map(function(it) { return (it.created_at || '').slice(0, 10); }).filter(Boolean).sort();
  var headText = '情报精选（' + items.length + ' 篇）';
  var y = 208;
  ctx.fillStyle = '#1F2937'; ctx.font = '700 26px sans-serif';
  var headW = ctx.measureText(headText).width;
  ctx.fillText(headText, x, y);
  if (dates.length) {
    var rangeStr = (dates[0] === dates[dates.length-1]) ? dates[0] : (dates[0] + ' 至 ' + dates[dates.length-1]);
    ctx.fillStyle = '#9CA3AF'; ctx.font = '400 15px sans-serif';
    ctx.fillText(rangeStr, x + headW + 14, y);
  }
  y = 260;

  // 各篇：编号 + 标题 + 标签 + 全文（不含来源）
  blocks.forEach(function(b, bi) {
    var it = b.it;
    ctx.fillStyle = '#3B82F6';
    roundRect(ctx, x, y, 34, 34, 8); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '700 17px sans-serif';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(bi + 1).padStart(2, '0'), x + 7, y + 19);
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#1F2937'; ctx.font = '700 26px sans-serif';
    for (var li = 0; li < b.titleLines.length; li++) {
      ctx.fillText(b.titleLines[li], x + 48, y + 13 + li * 38);
    }
    y += b.titleLines.length * 38 + 14;
    // 标签
    ctx.font = '500 15px sans-serif';
    var tags = [];
    if (it.category) tags.push(it.category);
    if (it.company) tags.push(it.company);
    tags.push((it.created_at || '').slice(0, 10));
    var tagX = x;
    for (var ti = 0; ti < tags.length; ti++) {
      var tw = ctx.measureText(tags[ti]).width + 22;
      ctx.fillStyle = '#EEF0F3';
      roundRect(ctx, tagX, y - 16, tw, 30, 6); ctx.fill();
      ctx.fillStyle = ti === 0 ? '#722ED1' : '#4B5563';
      ctx.fillText(tags[ti], tagX + 11, y + 4);
      tagX += tw + 10;
    }
    y += 44;
    // 全文（不显示来源；已去 Markdown 符号、链接只留文字、图片去掉；段落首行缩进 2 字符）
    ctx.fillStyle = '#4B5563'; ctx.font = '400 17px sans-serif';
    for (var si = 0; si < b.contentLines.length; si++) {
      ctx.fillText(b.contentLines[si], x, y + si * 28);
    }
    y += b.contentLines.length * 28 + 20;
    // 篇间分隔线（最后一篇后不画，尾部分隔线在 CTA 前）
    if (bi < blocks.length - 1) {
      ctx.strokeStyle = '#E5E7EB'; ctx.setLineDash([4,4]); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + cw, y); ctx.stroke(); ctx.setLineDash([]);
      y += 28;
    }
  });

  // 尾部：分隔线 + CTA
  ctx.strokeStyle = '#E5E7EB'; ctx.setLineDash([4,4]); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + cw, y); ctx.stroke(); ctx.setLineDash([]);
  y += 36;
  ctx.fillStyle = '#1F2937'; ctx.font = '700 24px sans-serif';
  ctx.fillText('想看更多情报？', x, y);
  ctx.fillStyle = '#4B5563'; ctx.font = '400 17px sans-serif';
  drawLines(ctx, splitLines(ctx, '注册后，每日自动采集 1200+ 条竞品/商机情报，追踪 5 大行业，分析师每日推送。', cw, 2), x, y + 34, 28);
  y += 96;

  // 二维码 + 文案 + 底部 slogan：白底框/边框/文字先同步绘制，
  // QR 图在 toCanvas 异步回调后画在最上层（若框后画会把 QR 盖掉）
  var qrSize = 180, qrX = x, qrY = y;
  ctx.fillStyle = '#fff';
  roundRect(ctx, qrX - 8, qrY - 8, qrSize + 16, qrSize + 16, 12); ctx.fill();
  ctx.strokeStyle = '#D6E4FF'; ctx.lineWidth = 1;
  roundRect(ctx, qrX - 8, qrY - 8, qrSize + 16, qrSize + 16, 12); ctx.stroke();
  var tx = qrX + qrSize + 28;
  ctx.fillStyle = '#1F2937'; ctx.font = '600 20px sans-serif';
  ctx.fillText('业务情报社', tx, qrY + 30);
  ctx.fillStyle = '#9CA3AF'; ctx.font = '400 16px sans-serif';
  drawLines(ctx, splitLines(ctx, '长按识别二维码\n进入业务情报社\n每日 10:00 推送行业情报', W - PAD*2 - (qrSize + 28) - 72, 3), tx, qrY + 62, 26);
  ctx.fillStyle = '#9CA3AF'; ctx.font = '400 14px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('本海报由 业务情报社 自动采集生成 · 内容仅供参考', W/2, H - PAD - 36);
  ctx.textAlign = 'left';
  var finish = function() {
    batchState.ready = true;
    var btn = document.getElementById('batchPosterBtn');
    if (btn) { btn.disabled = false; btn.style.opacity = ''; }
  };
  if (typeof QRCode !== 'undefined') {
    var qrCanvas = document.createElement('canvas');
    QRCode.toCanvas(qrCanvas, window.location.origin, { width: qrSize, margin: 1, color: { dark: '#1F2937', light: '#ffffff' } }, function(err) {
      if (!err) ctx.drawImage(qrCanvas, qrX, qrY, qrSize, qrSize);
      finish();
    });
  } else {
    finish();
  }
}

function downloadBatchPoster() {
  var canvas = document.getElementById('batchPoster');
  if (!canvas) { toast('海报未生成，请关闭弹窗后重试'); return; }
  if (!batchState.ready) { toast('海报生成中，请稍候'); return; }
  var d = new Date();
  var ds = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  // 与单篇分享一致：优先系统分享面板（可选微信等 App 直接发送），不支持则下载
  shareCanvasPoster(canvas, '情报合集分享_' + ds + '.png', '情报合集分享', '');
}

document.addEventListener('click', function(e) {
  if (e.target.closest('#attachmentsSection label') && currentIntel) {
    document.getElementById('attachFile').click();
  }
});

// ── 下拉刷新（移动端）──────────────────────────────────────────
// 仅在触屏设备启用；列表滚动到顶部后继续下拉才触发，上滑/中部落下不干预正常滚动。
// 刷新 = 重新拉取情报列表（保留当前项目筛选与搜索/分类条件），并更新统计行。
(function initPullRefresh() {
  if (!('ontouchstart' in window)) return;
  var main = document.querySelector('main.main');
  var indicator = document.getElementById('pullRefresh');
  if (!main || !indicator) return;

  var THRESHOLD = 60, MAX_PULL = 84, RESIST = 0.45, PULL_TRIGGER = 10;
  var startY = 0, armed = false, pulling = false, pullPx = 0, refreshing = false;

  function setPull(px) {
    pullPx = px;
    indicator.style.height = px + 'px';
    var icon = indicator.querySelector('.pr-icon');
    if (icon && !indicator.classList.contains('refreshing')) {
      icon.style.transform = 'rotate(' + (Math.max(0, Math.min(px / THRESHOLD, 1)) * 180) + 'deg)';
    }
    indicator.classList.toggle('ready', px >= THRESHOLD);
  }

  function collapse() {
    indicator.style.transition = 'height .25s ease';
    setPull(0);
    setTimeout(function () { indicator.style.transition = ''; }, 300);
  }

  async function doRefresh() {
    refreshing = true;
    indicator.classList.add('refreshing');
    indicator.style.height = '52px';
    var prevCat = (document.getElementById('catFilter') || {}).value || '';
    try {
      await loadData();
      render();
      // render() 会重建分类下拉（清空选中值）：恢复刷新前的分类筛选
      if (prevCat) document.getElementById('catFilter').value = prevCat;
      buildSidebarCats();
      updateShareButtons();
      applyFilters();
      var d = new Date();
      toast('已刷新 ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + ':' + String(d.getSeconds()).padStart(2, '0'));
    } catch (e) {
      console.log('[PULL-REFRESH] error:', e);
      toast('刷新失败，请重试');
    }
    indicator.classList.remove('refreshing');
    collapse();
    refreshing = false;
  }

  main.addEventListener('touchstart', function (e) {
    armed = !refreshing && main.scrollTop <= 0
      && !document.getElementById('detailPanel').classList.contains('open');
    startY = e.touches[0].clientY;
    pulling = false;
  }, { passive: true });

  main.addEventListener('touchmove', function (e) {
    if (!armed || refreshing) return;
    var dy = e.touches[0].clientY - startY;
    // ① 内容已被滚下去 → 本手势是正常滚动：若已劫持则立刻交还
    if (main.scrollTop > 0) {
      if (pulling) { pulling = false; collapse(); }
      return;
    }
    // ② 已触发下拉：跟手（带阻力）移动指示器；手指收回低于触发阈值 → 取消下拉、交还正常滚动
    if (pulling) {
      if (dy < PULL_TRIGGER) {
        pulling = false;
        collapse();
        return;
      }
      e.preventDefault();
      setPull(Math.min(dy * RESIST, MAX_PULL));
      return;
    }
    // ③ 明确的下拉位移（≥PULL_TRIGGER）才劫持手势：
    //    起始 1~2px 的抖动不得吞掉整个手势——否则列表在顶部无法开始正常下滑滚动
    if (dy > PULL_TRIGGER) {
      pulling = true;
      e.preventDefault(); // 抑制浏览器原生下拉（页面刷新/弹性滚动）
      setPull(Math.min(dy * RESIST, MAX_PULL));
    }
    // dy ≤ PULL_TRIGGER（含上滑）：不 preventDefault，交给浏览器正常滚动
  }, { passive: false });

  function endPull() {
    if (!armed) return;
    armed = false;
    if (!pulling) return;
    pulling = false;
    if (pullPx >= THRESHOLD) doRefresh();
    else collapse();
  }
  main.addEventListener('touchend', endPull);
  main.addEventListener('touchcancel', endPull);
})();

init();
</script>
