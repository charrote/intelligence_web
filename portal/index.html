<!DOCTYPE html>
<html lang="zh-CN">
<head>

<style>
.feed{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:stretch;background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);cursor:pointer;transition:all 0.15s}
.row:hover{border-color:var(--accent);background:var(--gray-50)}
.row-index{width:36px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--gray-400);flex-shrink:0}
.row-body{flex:1;padding:12px 16px 12px 0;overflow:hidden;display:flex;flex-direction:column;gap:6px}
.row-title{font-size:14px;font-weight:500;color:var(--gray-800);line-height:1.5}
.row-title.read{color:var(--gray-400)}
.row-meta{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--gray-400);flex-wrap:wrap}
.row-meta .tag{display:inline-flex;padding:1px 6px;border-radius:2px;font-size:11px;font-weight:500;color:var(--gray-600);background:var(--gray-100)}
.row-meta .tag-company{color:var(--accent);background:var(--accent-light)}
.row-meta .deal{color:var(--green);font-weight:500}
.stat-num.gold{color:var(--amber)}.stat-num.green{color:var(--green)}.stat-num.accent{color:var(--accent)}.stat-num.blue{color:var(--blue)}
.pager{display:flex;align-items:center;justify-content:center;gap:6px;margin:20px 0 8px;flex-wrap:wrap}
.pg-info{font-size:12px;color:var(--gray-400);margin-right:8px}
.pg-btn{min-width:30px;height:30px;padding:0 8px;border:1px solid var(--gray-200);background:#fff;border-radius:4px;font-size:13px;color:var(--gray-600);cursor:pointer;line-height:28px;text-align:center}
.pg-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.pg-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.pg-btn:disabled{opacity:.4;cursor:not-allowed}
.pg-dots{color:var(--gray-400);padding:0 2px}
#sidebarCats{}
/* ── Share modal ── */
.share-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:none;align-items:center;justify-content:center;padding:16px}
.share-modal-overlay.open{display:flex}
.share-modal{background:#fff;border-radius:12px;width:100%;max-width:360px;max-height:88vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.share-modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--gray-200)}
.share-modal-head h3{font-size:15px;font-weight:600;color:var(--gray-800)}
.share-modal-body{padding:16px 18px}
.share-label{font-size:12px;color:var(--gray-400);margin:0 0 8px;font-weight:600}
.share-label + .share-link-row, .share-label + .share-poster-wrap{margin-top:0}
.share-link-row{display:flex;align-items:center;gap:8px;background:var(--gray-50);border:1px solid var(--gray-200);border-radius:8px;padding:9px 12px}
.share-link-row .txt{flex:1;font-size:12px;color:var(--gray-600);word-break:break-all;line-height:1.5}
.share-poster-wrap{border:1px solid var(--gray-200);border-radius:8px;overflow:hidden;background:#F5F6F8}
.share-poster-wrap canvas{width:100%;height:auto;display:block}
.share-actions{display:flex;gap:8px;margin-top:16px}
.share-actions .btn{flex:1}
.share-tip{font-size:11px;color:var(--gray-400);margin-top:12px;text-align:center;line-height:1.6}
</style>
</head>
<body>
<main class="main">
  <div class="stats" id="statsRow">
    <div class="stat"><div class="stat-num accent" id="statTotal">-</div><div class="stat-label">全部情报</div></div>
    <div class="stat"><div class="stat-num gold" id="statUnread">-</div><div class="stat-label">未读</div></div>
    <div class="stat"><div class="stat-num blue" id="statRecent">-</div><div class="stat-label">近7天新增</div></div>
    <div class="stat"><div class="stat-num green" id="statCats">-</div><div class="stat-label">分类</div></div>
  </div>
  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="搜索情报..." oninput="onFilterChange()">
    <select id="catFilter" onchange="onFilterChange()">
      <option value="">全部分类</option>
    </select>
    <select id="projFilter" onchange="onProjChange()">
      <option value="">全部项目</option>
    </select>
    <span class="spacer"></span>
  </div>
  <div class="feed" id="feed"></div>
  <div class="pager" id="pager"></div>
</main>
<div class="panel" id="detailPanel">
  <div class="panel-head"><h2 id="panelTitle">详情</h2><button class="panel-close" onclick="closePanel()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
  <div class="panel-body" id="panelBody"></div>
  <div class="panel-foot" id="panelFoot"></div>
</div>
<div class="panel-overlay" onclick="closePanel()"></div>
<!-- 分享弹窗 -->
<div class="share-modal-overlay" id="shareModal">
  <div class="share-modal">
    <div class="share-modal-head">
      <h3>分享情报</h3>
      <button class="panel-close" onclick="closeShare()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="share-modal-body">
      <div class="share-label">分享链接</div>
      <div class="share-link-row">
        <span class="txt" id="shareLinkText">加载中…</span>
        <button class="btn btn-primary btn-sm" onclick="copyShareLink()">复制</button>
      </div>
      <div class="share-label" style="margin-top:16px">分享海报（朋友圈）</div>
      <div class="share-poster-wrap"><canvas id="sharePoster"></canvas></div>
      <div class="share-actions">
        <button class="btn btn-primary" id="posterBtn" onclick="downloadPoster()">下载海报</button>
      </div>
      <div class="share-tip">复制链接发到微信，或保存海报分享到朋友圈<br>分享内容为完整正文，对方无需登录即可查看</div>
    </div>
  </div>
</div>
<script>
console.log("[TEST] Script loaded");
var currentIntel = null;
var allItems = [];
var currentPage = 1;       // 当前页码（1 起）
var PAGE_SIZE = 20;        // 每页条数
var currentFiltered = [];  // 当前筛选后的全量列表（翻页用）
var domainConfig = null, statusMap = {};
var domainPort = parseInt(window.location.port) || (location.protocol === 'https:' ? 443 : 80);
var allProjects = [];
var isAdmin = (getUser() && getUser().role === 'admin');

function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c];
  });
}

// 稳健时间解析：created_at 是微秒精度无时区（2026-07-22T04:22:38.690408），
// Safari 对带微秒的非标准 ISO 会返回 NaN → 截断到秒后解析，全浏览器可用
function parseDate(iso) {
  if (!iso) return null;
  var s = String(iso).replace(/(\.\d+).*/, '').replace(' ', 'T');
  var d = new Date(s);
  return isNaN(d) ? null : d;
}

function renderMarkdown(text) {
  if (!text) return '';
  var html;
  try {
    html = marked.parse(text);
    if (typeof DOMPurify !== 'undefined') {
      html = DOMPurify.sanitize(html);
    }
  } catch(e) {
    console.warn('[renderMarkdown] parse error:', e);
    return escapeHtml(text);
  }
  // 情报正文里的超链接一律标为外部链接（data-ext）——
  // 由全局外链守卫拦截：弹提示 → 新标签页打开，绝不在系统内导航。
  var tmp = document.createElement('div');
  tmp.innerHTML = html;
  var links = tmp.querySelectorAll('a[href]');
  for (var i = 0; i < links.length; i++) {
    var a = links[i];
    var href = a.getAttribute('href');
    // 只拦截真正的网址链接；锚点(#)、mailto/tel 交给浏览器默认处理
    if (!href || href.charAt(0) === '#') continue;
    if (/^(mailto:|tel:)/i.test(href)) continue;
    a.setAttribute('data-ext', '1');
    a.removeAttribute('target'); // 新标签页统一由守卫 window.open 控制
  }
  return tmp.innerHTML;
}

function closePanel(){document.getElementById('detailPanel').classList.remove('open');currentIntel=null;applyFilters()}

async function init() {
  initExternalLinkGuard(); // 情报详情超链接 → 弹提示 + 新标签页打开，不在系统内导航
  await loadDomainConfig();
  await loadProjectsList();
  await loadData();
  render();
  buildSidebarCats();
  // 聚焦消费：从工作台跳转来，定位到指定情报详情
  var focusId = localStorage.getItem('qm_open_intel');
  if (focusId) {
    localStorage.removeItem('qm_open_intel');
    openDetail(parseInt(focusId));
  }
}

async function loadProjectsList() {
  try {
    var r = await apiFetch(APP_API_BASE + '/api/projects?status=active');
    var d = await r.json();
    allProjects = d.items || [];
    var sel = document.getElementById('projFilter');
    if (sel) {
      allProjects.forEach(function(p) {
        var o = document.createElement('option');
        o.value = p.id;
        o.textContent = p.name + (p.target_name ? ' — ' + p.target_name : '');
        sel.appendChild(o);
      });
    }
  } catch(e) { /* projects loading is non-critical */ }
}

async function loadDomainConfig() {
  try {
    var res = await apiFetch(APP_API_BASE + '/api/domain_config');
    var data = await res.json();
    domainConfig = data;
    if (data.statuses) {
      data.statuses.forEach(function(s) { statusMap[s.key || s[0]] = s.label || s[1]; });
    }
  } catch(e) { statusMap = {pending:'待处理',active:'处理中',done:'已完成'}; }
}

async function loadData() {
  try {
    var projFilter = document.getElementById('projFilter')?.value || '';
    var url = APP_API_BASE + '/api/intelligence?limit=500';
    if (projFilter) url += '&project_id=' + projFilter;
    var r = await apiFetch(url); var d = await r.json(); allItems = Array.isArray(d) ? d : (d.items || []); console.log('[DATA] loaded', allItems.length, 'items');
  } catch(e) { console.log('[DATA] error:', e); allItems = []; }
}

function buildSidebarCats() {
  var list = document.getElementById('sidebarCats'); if (!list) return;
  list.innerHTML = '';
  var cats = [];
  for (var i = 0; i < allItems.length; i++) { if (allItems[i].category && cats.indexOf(allItems[i].category) === -1) cats.push(allItems[i].category); }
  cats.slice(0,12).forEach(function(c) {
    var d=document.createElement('div'); d.className='sidebar-item'; d.innerHTML='<span class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></span>'+escapeHtml(c);
    d.onclick=function(){document.getElementById('catFilter').value=c;onFilterChange()};
    list.appendChild(d);
  });
}

function render() {
  var t=allItems.length;
  var unread=allItems.filter(function(i){return !isRead(i.id)}).length;
  var now=Date.now(), W=7*86400000;
  var recent=allItems.filter(function(i){var d=parseDate(i.created_at);return d&&(now-d.getTime())<W}).length;
  var catset={};allItems.forEach(function(i){if(i.category)catset[i.category]=1});
  document.getElementById('statTotal').textContent=t;
  document.getElementById('statUnread').textContent=unread;
  document.getElementById('statRecent').textContent=recent;
  document.getElementById('statCats').textContent=Object.keys(catset).length;
  // 状态维度已对用户隐藏，不再渲染状态筛选
  var cs=document.getElementById('catFilter'); var cats=[]; for(var i=0;i<allItems.length;i++){if(allItems[i].category&&cats.indexOf(allItems[i].category)===-1)cats.push(allItems[i].category)}
  cs.innerHTML='<option value="">全部分类</option>'; cats.forEach(function(c){var o=document.createElement('option');o.value=c;o.textContent=c;cs.appendChild(o)});
  applyFilters();
}

// 纯筛选+渲染当前页：按当前 UI 状态（搜索/分类）过滤 allItems，渲染 currentPage。
// 不重置页码——供详情标记已读后刷新标题色用（保持当前页）。
function applyFilters() {
  var s=document.getElementById('searchInput').value.toLowerCase();
  var cat=document.getElementById('catFilter').value;
  var items=allItems;
  if(s)items=items.filter(function(i){return (i.title||'').toLowerCase().includes(s)||(i.content||'').toLowerCase().includes(s)});
  if(cat)items=items.filter(function(i){return i.category===cat});
  currentFiltered=items;
  renderFeed(items);
}

// 筛选条件变化（搜索/分类）：回第一页再渲染
function onFilterChange(){currentPage=1;applyFilters();}

// 项目筛选是服务端过滤：重载数据后回第一页再渲染
async function onProjChange(){currentPage=1;await loadData();applyFilters();}

function renderFeed(items) {
  var feed=document.getElementById('feed');
  var total=items.length;
  var totalPages=Math.max(1,Math.ceil(total/PAGE_SIZE));
  if(currentPage>totalPages)currentPage=totalPages;
  if(currentPage<1)currentPage=1;
  var start=(currentPage-1)*PAGE_SIZE;
  var pageItems=items.slice(start,start+PAGE_SIZE);
  if(!total){
    feed.innerHTML='<div style="padding:40px;text-align:center;color:var(--gray-400);font-size:13px;">暂无匹配的情报</div>';
    renderPager(0);
    return;
  }
  feed.innerHTML=pageItems.map(function(item,pi){
    var gi=start+pi;   // 全局连续编号（跨页不重排）
    var co=escapeHtml(item.company||''), de=item.deal_value?(item.deal_value>10000?'¥'+(item.deal_value/10000).toFixed(0)+'万':'¥'+item.deal_value):'';
    var ents=(item.entities||[]).map(function(e){return '<span class="tag" style="background:#f0e6ff;color:#722ed1">'+escapeHtml(e)+'</span>'}).join('');
    var projTag='';
    if(item.project_id){
      var proj=allProjects.find(function(p){return p.id==item.project_id});
      if(proj) projTag='<span class="tag" style="background:var(--accent-light);color:var(--accent);font-size:10px">'+escapeHtml(proj.name)+'</span>';
    }
    return '<div class="row" onclick="openDetail('+item.id+')">'
    +'<div class="row-index">'+(gi+1).toString().padStart(2,'0')+'</div>'
    +'<div class="row-body"><div class="row-title'+(isRead(item.id)?' read':'')+'">'+escapeHtml(item.title||'')+'</div>'
    +'<div class="row-meta">'+(item.category?'<span class="tag">'+escapeHtml(item.category)+'</span>':'')
    +(co?'<span class="tag tag-company">'+co+'</span>':'')+(de?'<span class="deal">'+de+'</span>':'')
    +projTag+ents
    +'<span>'+formatDate(item.created_at)+'</span>'
    +(item.comment_count>0?'<span style="display:flex;align-items:center;gap:3px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>'+item.comment_count+'</span>':'')
    +'</div></div></div>'
    }).join('');
  renderPager(total);
}

// 分页控制条：上一页 / 页码（窗口化+省略号）/ 下一页
function renderPager(total) {
  var el=document.getElementById('pager'); if(!el)return;
  if(!total){el.innerHTML='';return;}
  var totalPages=Math.ceil(total/PAGE_SIZE);
  var from=(currentPage-1)*PAGE_SIZE+1, to=Math.min(currentPage*PAGE_SIZE,total);
  var h='<span class="pg-info">第 '+from+'–'+to+' 条 / 共 '+total+' 条</span>';
  h+='<button class="pg-btn" '+(currentPage<=1?'disabled':'')+' onclick="goToPage('+(currentPage-1)+')">&laquo;</button>';
  h+=pageButtons(totalPages);
  h+='<button class="pg-btn" '+(currentPage>=totalPages?'disabled':'')+' onclick="goToPage('+(currentPage+1)+')">&raquo;</button>';
  el.innerHTML=h;
}

// 窗口化页码：始终显示首尾页，当前页前后各 2，溢出用省略号
function pageButtons(totalPages) {
  var cur=currentPage;
  if(totalPages<=7){
    var all='';
    for(var i=1;i<=totalPages;i++) all+='<button class="pg-btn'+(i===cur?' active':'')+'" onclick="goToPage('+i+')">'+i+'</button>';
    return all;
  }
  var start=Math.max(1,cur-2), end=Math.min(totalPages,start+4);
  if(end-start<4){start=Math.max(1,end-4);}
  var h='';
  if(start>1){
    h+='<button class="pg-btn" onclick="goToPage(1)">1</button>';
    if(start>2) h+='<span class="pg-dots">…</span>';
  }
  for(var i=start;i<=end;i++) h+='<button class="pg-btn'+(i===cur?' active':'')+'" onclick="goToPage('+i+')">'+i+'</button>';
  if(end<totalPages){
    if(end<totalPages-1) h+='<span class="pg-dots">…</span>';
    h+='<button class="pg-btn" onclick="goToPage('+totalPages+')">'+totalPages+'</button>';
  }
  return h;
}

function goToPage(n){
  var totalPages=Math.max(1,Math.ceil((currentFiltered.length||0)/PAGE_SIZE));
  if(n<1||n>totalPages)return;
  currentPage=n;
  renderFeed(currentFiltered);
  var f=document.getElementById('feed'); if(f)f.scrollIntoView({behavior:'smooth',block:'start'});
}

function resetFilter(){document.getElementById('searchInput').value='';document.getElementById('catFilter').value='';onFilterChange()}

async function openDetail(id) {
  try {
    var r=await apiFetch(APP_API_BASE+'/api/intelligence/'+id);currentIntel=await r.json();
    markRead(id);  // 点开即标记已读
    document.getElementById('panelTitle').textContent=currentIntel.title;
    renderDetail();loadComments(id);
    var panel = document.getElementById('detailPanel');
    panel.classList.add('open');
    // 刷新列表标题颜色（已读变浅），保持当前页
    applyFilters();
  }catch(e){ console.log('[OPEN] error:', e); }
}

function renderDetail() {
  var d=currentIntel; var body=document.getElementById('panelBody'); var foot=document.getElementById('panelFoot');
  var ents=(d.entities||[]).map(function(e){return '<span class="tag" style="background:#f0e6ff;color:#722ed1">'+escapeHtml(e)+'</span>'}).join('');
  body.innerHTML='<div class="detail-meta">'
    +(d.category?'<span class="tag tag-cat">'+escapeHtml(d.category)+'</span>':'')
    +(d.company?'<span class="tag tag-company">'+escapeHtml(d.company)+'</span>':'')
    +'</div>'
    +(ents?'<div style="margin-bottom:12px;font-size:12px;color:var(--gray-600)"><span style="color:var(--gray-400);margin-right:4px;">关联实体：</span>'+ents+'</div>':'')
    +(d.opinion?'<div class="detail-opinion">意见：'+escapeHtml(d.opinion)+'</div>':'')
    +(d.source_url?'<div style="margin-bottom:12px;"><a href="'+escapeHtml(d.source_url)+'" data-ext="1" data-label="打开原文链接" style="font-size:13px;color:var(--accent);">原文链接</a></div>':'')
    +('<div class="detail-source">'+formatDate(d.created_at)+'</div>'
    +'<div class="detail-content">'+renderMarkdown(d.content)+'</div>')
    +'<div id="attachmentsSection" style="margin-top:16px;padding-top:14px;border-top:1px solid var(--gray-200)">'
    +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">'
    +'<h3 style="font-size:13px;font-weight:600;color:var(--gray-700)">附件</h3>'
    +'<label style="font-size:12px;color:var(--accent);cursor:pointer">'
    +'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:3px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>上传</label>'
    +'<input type="file" id="attachFile" style="display:none" onchange="uploadAttachment('+currentIntel.id+')" multiple>'
    +'</div>'
    +'<div id="attachmentsList" style="font-size:13px">加载中...</div>'
    +'</div>'
    +'<div class="comment-section"><h3>评论</h3>'
    +'<div id="commentsContainer" style="margin-bottom:12px">加载中...</div>'
    +'<div class="comment-composer" id="commentComposer">'
    +'<textarea id="commentInput" rows="3" maxlength="2000" placeholder="写下你的看法（最多 2000 字）" '
    +'onkeydown="if(event.key===\'Enter\'&&(event.ctrlKey||event.metaKey))submitHumanComment()"></textarea>'
    +'<div class="comment-composer-foot">'
    +'<span id="commentCount" style="font-size:11px;color:var(--gray-400)"></span>'
    +'<button class="btn btn-primary btn-sm" id="commentSubmitBtn" onclick="submitHumanComment()">发表评论</button>'
    +'</div>'
    +'</div>'
    +'</div>';
  // 状态流转按钮已隐藏（状态模型未定），保留管理员删除；分享按角色权限"开放情报分享"渲染
  var btns='';
  if(canShareIntel()){
    btns+='<button class="btn btn-primary" onclick="openShare()" style="display:inline-flex;align-items:center;gap:5px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="10.5" x2="15.4" y2="6.5"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/></svg>分享</button>';
  }
  if(isAdmin){btns+='<button class="btn btn-danger" onclick="deleteIntel('+currentIntel.id+')" style="background:#b33a3a;color:#fff">删除</button>';}
  foot.style.display='';foot.innerHTML=btns;
  bindCommentInput();
}

// 状态流转（updateStatus）已随状态模型一起隐藏——情报流程态暂未确定，
// 用户当前只需阅读 + 未读/已读。待"行动/价值"模型想清楚后再接回。

async function deleteIntel(id) {
  if(!confirm('确定删除该情报？此操作不可恢复。')) return;
  try {
    var r = await apiFetch(APP_API_BASE+'/api/intelligence/'+id, {method:'DELETE'});
    if(r.ok){ closePanel(); await loadData(); render(); }
    else { var data = await r.json(); alert(data.error || '删除失败'); }
  } catch(e) { alert('删除失败'); }
}

function updateCommentCharCount() {
  var ta=document.getElementById('commentInput');
  var el=document.getElementById('commentCount');
  if(!ta||!el)return;
  el.textContent=ta.value.length+' / 2000';
}

async function loadComments(id) {
  try {
    var r=await apiFetch(APP_API_BASE+'/api/intelligence/'+id+'/comments?limit=50');var comments=await r.json();
    var c=document.getElementById('commentsContainer');if(!c)return;
    if(!comments.length){c.innerHTML='<div style="color:var(--gray-400);font-size:13px;">暂无评论</div>';return;}
    var me=(getUser()||{}).id;
    c.innerHTML=comments.map(function(co){
      var isHuman=co.user_id!=null;
      var badge,isSelf=false;
      if(isHuman){
        badge='<span class="cbadge cbadge-human">人</span>';
        if(me!=null&&co.user_id===me)isSelf=true;
      }else{
        badge='<span class="cbadge cbadge-ai">AI</span>';
      }
      var name=escapeHtml(co.agent_name||'');
      var selfTag=isSelf?'<span class="comment-self">（我）</span>':'';
      return '<div class="comment '+(isSelf?'comment-self-card':'')+'"><div class="comment-head">'
        +'<span class="comment-name">'+badge+name+selfTag+'</span>'
        +'<span class="comment-time">'+formatDate(co.created_at)+'</span>'
        +'</div><div class="comment-text">'+escapeHtml(co.content||'')+'</div></div>';
    }).join('');
  }catch(e){}
}

function bindCommentInput() {
  var ta=document.getElementById('commentInput');
  if(!ta||ta.__bound)return;
  ta.__bound=true;
  ta.addEventListener('input',updateCommentCharCount);
  updateCommentCharCount();
}

async function submitHumanComment() {
  if(!currentIntel)return;
  var ta=document.getElementById('commentInput');
  var btn=document.getElementById('commentSubmitBtn');
  if(!ta)return;
  var text=ta.value.trim();
  if(!text){ta.focus();return;}
  if(text.length>2000){alert('评论内容不能超过 2000 字');return;}
  if(btn)btn.disabled=true;
  try {
    var r=await apiFetch(APP_API_BASE+'/api/intelligence/'+currentIntel.id+'/human-comment',{
      method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:text})
    });
    if(!r.ok){
      var d={};try{d=await r.json();}catch(e2){}
      alert(d.error||'评论发表失败');
    }else{
      ta.value='';
      updateCommentCharCount();
      await loadComments(currentIntel.id);
    }
  }catch(e){alert('评论发表失败');}
  finally{if(btn)btn.disabled=false;}
}

async function uploadAttachment(intelId) {
  var input = document.getElementById('attachFile');
  var files = input.files;
  if (!files.length) return;
  var fd = new FormData();
  for (var i = 0; i < files.length; i++) {
    fd.append('file', files[i]);
    var desc = prompt('请输入文件描述（可选，可留空）', '');
    fd.append('description', desc !== null ? desc : '');
  }
  try {
    var r = await apiFetch(APP_API_BASE+'/api/intelligence/'+intelId+'/attachments', {
      method: 'POST',
      body: fd,
    });
    if (r.ok) {
      input.value = '';
      await loadAttachments(intelId);
    } else {
      var data = await r.json();
      alert(data.error || '上传失败');
    }
  } catch(e) { alert('上传失败'); }
}

async function loadAttachments(intelId) {
  try {
    var r = await apiFetch(APP_API_BASE+'/api/intelligence/'+intelId+'/attachments', {});
    var data = await r.json();
    var container = document.getElementById('attachmentsList');
    if (!data.items.length) {
      container.innerHTML = '<div style="color:var(--gray-400);font-size:12px">暂无附件</div>';
      return;
    }
    container.innerHTML = data.items.map(function(att) {
      var isImage = att.content_type && att.content_type.startsWith('image/');
      var size = att.file_size ? (att.file_size < 1024 ? att.file_size+'B' : (att.file_size < 1048576 ? (att.file_size/1024).toFixed(1)+'KB' : (att.file_size/1048576).toFixed(1)+'MB')) : '';
      var icon = isImage ? '🖼️' : '📎';
      return '<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--gray-100)">'
        +'<span>'+icon+'</span>'
        +'<a href="'+APP_API_BASE+'/api/attachments/'+att.id+'" target="_blank" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--accent);text-decoration:none;font-size:12px" title="'+escapeHtml(att.filename)+'">'+escapeHtml(att.filename)+'</a>'
        +'<span style="font-size:11px;color:var(--gray-400)">'+size+'</span>'
        +'</div>';
    }).join('');
  } catch(e) {
    var container = document.getElementById('attachmentsList');
    if (container) container.innerHTML = '<div style="color:var(--gray-400);font-size:12px">加载失败</div>';
  }
}

// ── 分享 ──────────────────────────────────────────────────────────
var shareState = { url: '' };

// 分享权限：admin 或角色勾选了"开放情报分享"（intel.share）
function canShareIntel() {
  var u = getUser();
  if (!u) return false;
  if (u.role === 'admin') return true;
  return ((u.permission_codes || []).indexOf('intel.share') !== -1);
}

async function openShare() {
  if (!currentIntel) return;
  if (!canShareIntel()) { alert('没有分享权限（需在角色中勾选"开放情报分享"）'); return; }
  var id = currentIntel.id;
  try {
    // 若本条尚未开启分享，先开启（生成 token）
    var r = await apiFetch(APP_API_BASE + '/api/intelligence/' + id + '/share', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ enabled: true })
    });
    var d = await r.json();
    if (!r.ok) { alert(d.error || '开启分享失败'); return; }
    shareState.url = d.share_url;
    shareState.posterReady = false;
    var pb = document.getElementById('posterBtn');
    if (pb) { pb.disabled = true; pb.style.opacity = '.6'; }
    document.getElementById('shareLinkText').textContent = d.share_url;
    document.getElementById('shareModal').classList.add('open');
    renderPoster(currentIntel, d.share_url);
  } catch(e) { alert('开启分享失败：' + e); }
}

function closeShare() { document.getElementById('shareModal').classList.remove('open'); }

async function copyShareLink() {
  if (!shareState.url) return;
  try {
    await navigator.clipboard.writeText(shareState.url);
    toast('链接已复制');
  } catch(e) {
    // 回退：选中手动复制
    var t = document.getElementById('shareLinkText');
    var range = document.createRange(); range.selectNode(t);
    window.getSelection().removeAllRanges(); window.getSelection().addRange(range);
    alert('请长按复制链接：\n' + shareState.url);
  }
}

function toast(msg) {
  var t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#1F2937;color:#fff;padding:8px 16px;border-radius:6px;font-size:13px;z-index:2000;opacity:0;transition:opacity .2s';
  document.body.appendChild(t);
  requestAnimationFrame(function(){ t.style.opacity='1'; });
  setTimeout(function(){ t.style.opacity='0'; setTimeout(function(){ t.remove(); }, 250); }, 1600);
}

// 文字换行（canvas）
function wrapText(ctx, text, x, y, maxW, lineH, maxLines) {
  var lines = [], line = '', i, ch;
  for (i = 0; i < text.length; i++) {
    ch = text[i];
    if (ch === '\n') { lines.push(line); line = ''; continue; }
    if (ctx.measureText(line + ch).width > maxW) { lines.push(line); line = ch; }
    else line += ch;
  }
  if (line) lines.push(line);
  if (maxLines && lines.length > maxLines) {
    lines = lines.slice(0, maxLines);
    lines[maxLines-1] = lines[maxLines-1].replace(/.{1,2}$/, '…');
  }
  for (var j = 0; j < lines.length; j++) ctx.fillText(lines[j], x, y + j * lineH);
  return lines.length;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function renderPoster(intel, url) {
  var canvas = document.getElementById('sharePoster');
  var W = 750, PAD = 48;
  var ctx = canvas.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);

  // 先按逻辑尺寸排版，最后整体放大绘制
  var body = (intel.content || '').replace(/[#*`>\-\[\]()!]/g, '').replace(/\n+/g, '\n');
  var maxBodyChars = 150;
  var bodyText = body.length > maxBodyChars ? body.slice(0, maxBodyChars) + '…' : body;
  var titleText = (intel.title || '').slice(0, 60);
  var dateStr = (intel.created_at || '').slice(0, 10);
  var tags = [];
  if (intel.category) tags.push(intel.category);
  if (intel.company) tags.push(intel.company);
  tags.push(dateStr);

  var H = 1180;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.scale(dpr, dpr);

  // 背景
  ctx.fillStyle = '#F5F6F8'; ctx.fillRect(0, 0, W, H);
  // 白色主卡
  ctx.fillStyle = '#fff';
  roundRect(ctx, PAD, PAD, W - PAD*2, H - PAD*2, 20); ctx.fill();

  var x = PAD + 36, cw = W - PAD*2 - 72;

  // 品牌
  ctx.fillStyle = '#3B82F6';
  roundRect(ctx, x, 88, 52, 52, 12); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = '700 26px sans-serif';
  ctx.textBaseline = 'middle'; ctx.fillText('情', x + 14, 116);
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#1F2937'; ctx.font = '600 24px sans-serif';
  ctx.fillText('业务情报社', x + 68, 112);
  ctx.fillStyle = '#9CA3AF'; ctx.font = '400 16px sans-serif';
  ctx.fillText('每日自动采集 · 行业情报', x + 68, 138);

  // 标题
  ctx.fillStyle = '#1F2937'; ctx.font = '700 30px sans-serif';
  var titleLines = wrapText(ctx, titleText, x, 210, cw, 44, 3);

  var y = 210 + titleLines * 44 + 18;

  // meta tags
  ctx.font = '500 15px sans-serif';
  var tagX = x;
  for (var ti = 0; ti < tags.length; ti++) {
    var tw = ctx.measureText(tags[ti]).width + 22;
    ctx.fillStyle = ti === tags.length-1 ? '#EEF0F3' : (ti===0?'#F3EBFF':'#EEF0F3');
    ctx.fillStyle = '#EEF0F3';
    roundRect(ctx, tagX, y - 16, tw, 30, 6); ctx.fill();
    ctx.fillStyle = ti===0 ? '#722ED1' : '#4B5563';
    ctx.fillText(tags[ti], tagX + 11, y + 4);
    tagX += tw + 10;
  }
  y += 40;

  // 正文
  ctx.fillStyle = '#4B5563'; ctx.font = '400 19px sans-serif';
  var bodyLines = wrapText(ctx, bodyText, x, y, cw, 32, 12);
  y += bodyLines * 32 + 24;

  // 分隔线
  ctx.strokeStyle = '#E5E7EB'; ctx.setLineDash([4,4]); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x+cw, y); ctx.stroke(); ctx.setLineDash([]);
  y += 36;

  // CTA
  ctx.fillStyle = '#1F2937'; ctx.font = '700 24px sans-serif';
  ctx.fillText('想看更多情报？', x, y);
  ctx.fillStyle = '#4B5563'; ctx.font = '400 17px sans-serif';
  wrapText(ctx, '注册后，每日自动采集 1200+ 条竞品/商机情报，追踪 5 大行业，分析师每日推送。', x, y + 34, cw, 28, 2);
  y += 96;

  // 二维码 + 文案 + 底部 slogan 统一放到 finish() 里，确保 QR 异步绘制完成后再允许下载
  var qrSize = 180, qrX = x, qrY = y;
  var finish = function() {
    ctx.fillStyle = '#fff';
    roundRect(ctx, qrX - 8, qrY - 8, qrSize + 16, qrSize + 16, 12); ctx.fill();
    ctx.strokeStyle = '#D6E4FF'; ctx.lineWidth = 1;
    roundRect(ctx, qrX - 8, qrY - 8, qrSize + 16, qrSize + 16, 12); ctx.stroke();
    var tx = qrX + qrSize + 28;
    ctx.fillStyle = '#1F2937'; ctx.font = '600 20px sans-serif';
    ctx.fillText('业务情报社', tx, qrY + 30);
    ctx.fillStyle = '#9CA3AF'; ctx.font = '400 16px sans-serif';
    wrapText(ctx, '长按识别二维码\n或复制链接到微信查看\n每日 10:00 推送行业情报', tx, qrY + 62, W - PAD*2 - (qrSize + 28) - 72, 26, 3);
    ctx.fillStyle = '#9CA3AF'; ctx.font = '400 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('本情报由 业务情报社 自动采集生成 · 内容仅供参考', W/2, H - PAD - 36);
    ctx.textAlign = 'left';
    shareState.posterReady = true;
    var btn = document.getElementById('posterBtn');
    if (btn) { btn.disabled = false; btn.style.opacity = ''; }
  };
  if (typeof QRCode !== 'undefined') {
    var qrCanvas = document.createElement('canvas');
    QRCode.toCanvas(qrCanvas, url, { width: qrSize, margin: 1, color: { dark: '#1F2937', light: '#ffffff' } }, function() {
      ctx.drawImage(qrCanvas, qrX, qrY, qrSize, qrSize);
      finish();
    });
  } else {
    finish();
  }
}

function downloadPoster() {
  var canvas = document.getElementById('sharePoster');
  if (!canvas || !shareState.url) return;
  if (!shareState.posterReady) { toast('海报生成中，请稍候'); return; }
  try {
    var a = document.createElement('a');
    a.download = '情报分享_' + (currentIntel ? currentIntel.id : 'intel') + '.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  } catch(e) { alert('海报下载失败：' + e); }
}

document.addEventListener('click', function(e) {
  if (e.target.closest('#attachmentsSection label') && currentIntel) {
    document.getElementById('attachFile').click();
  }
});
