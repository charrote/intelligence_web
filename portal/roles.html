<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>角色管理</title>
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/sidebar.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
<script src="js/dom.js"></script>
<script src="js/auth.js"></script>
<script src="js/init.js"></script>
<script src="js/tabs.js"></script>
<style>
.role-name{font-weight:600;color:var(--gray-800)}
.role-user-count{color:var(--gray-600);font-weight:500}
/* 图标按钮 */
.btn-icon{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border:none;border-radius:var(--radius);background:transparent;color:var(--gray-500);cursor:pointer;transition:all 0.12s;padding:0;position:relative}
.btn-icon:hover{background:var(--gray-100);color:var(--gray-700)}
.btn-icon::after{content:attr(data-tip);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:6px;padding:4px 8px;background:#1a1a1a;color:#fff;font-size:11px;border-radius:4px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity 0.15s;z-index:10}
.btn-icon:hover::after{opacity:1}
/* 操作列固定 */
.action-cell{position:sticky;right:0;background:#fff;z-index:1;min-width:60px;text-align:right;padding:10px 12px!important}
.action-btns{display:flex;gap:4px;justify-content:flex-end;align-items:center}
</style>
</head>
<body>
<main class="main">
  <h1>角色管理</h1>
  <p class="sub">管理系统角色与权限分配</p>
  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="搜索角色..." oninput="loadRoles()">
    <span class="spacer"></span>
    <button class="btn btn-primary" onclick="openCreate()">+ 新建角色</button>
  </div>
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th style="width:40px">#</th>
          <th>角色名称</th>
          <th>用户数</th>
          <th>创建时间</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="roleList">
        <tr><td colspan="5" class="empty">加载中...</td></tr>
      </tbody>
    </table>
  </div>
</main>

<!-- Create/Edit Panel -->
<div class="panel" id="createPanel">
  <div class="panel-head"><h2 id="panelTitle">新建角色</h2><button class="panel-close" onclick="closePanel()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
  <div class="panel-body">
    <div class="form-group">
      <label>角色名称 *</label>
      <input type="text" id="editRoleName" placeholder="如：admin, editor, viewer">
      <div style="font-size:11px;color:var(--gray-400);margin-top:4px">角色名称用于权限控制</div>
    </div>
    <div id="panelFeedback" style="display:none;padding:10px;border-radius:var(--radius);font-size:13px;margin-top:8px"></div>
  </div>
  <div class="panel-foot">
    <button class="btn btn-primary" onclick="saveRole()">保存</button>
    <button class="btn btn-ghost" onclick="closePanel()">取消</button>
  </div>
</div>
<div class="panel-overlay" id="overlay" onclick="closePanel()"></div>

<script>
var token = getToken();
if (!token) { window.location.href = '/portal/login.html'; }

var editingRoleId = null;

function formatDate(iso){if(!iso)return'-';var d=new Date(iso);if(isNaN(d))return iso;return d.getFullYear()+'-'+(d.getMonth()+1).toString().padStart(2,'0')+'-'+d.getDate().toString().padStart(2,'0')}

function loadRoles(){
  apiFetch(apiBase()+'/api/roles').then(function(r){return r.json()}).then(function(roles){
    var search = document.getElementById('searchInput').value.toLowerCase();
    var filtered = search ? roles.filter(function(r){ return r.name.toLowerCase().includes(search); }) : roles;
    var tbody = document.getElementById('roleList');
    if(!filtered.length){tbody.innerHTML='<tr><td colspan="5" class="empty">暂无角色</td></tr>';return;}
    tbody.innerHTML = filtered.map(function(role, i){
      return '<tr>'
        +'<td style="color:var(--gray-400)">'+(i+1).toString().padStart(2,'0')+'</td>'
        +'<td><span class="role-name">'+escapeHtml(role.name)+'</span></td>'
        +'<td><span class="role-user-count">'+(role.user_count||0)+' 人</span></td>'
        +'<td>-</td>'
        +'<td class="action-cell"><div class="action-btns">'
          + '<button class="btn-icon" onclick="openEdit('+role.id+')" data-tip="编辑"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>'
        +'</div></td>'
        +'</tr>';
    }).join('');
  }).catch(function(){
    document.getElementById('roleList').innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--gray-400);padding:30px">加载失败</td></tr>';
  });
}

function openCreate(){
  editingRoleId = null;
  document.getElementById('panelTitle').textContent = '新建角色';
  document.getElementById('editRoleName').value = '';
  document.getElementById('panelFeedback').style.display = 'none';
  document.getElementById('createPanel').classList.add('open');
  document.getElementById('editRoleName').focus();
}

function openEdit(id){
  editingRoleId = id;
  document.getElementById('panelTitle').textContent = '编辑角色';
  // Fetch role details to pre-fill
  apiFetch(apiBase()+'/api/roles').then(function(r){return r.json()}).then(function(roles){
    var role = roles.find(function(r){ return r.id === id; });
    if(role){
      document.getElementById('editRoleName').value = role.name;
    }
    document.getElementById('panelFeedback').style.display = 'none';
    document.getElementById('createPanel').classList.add('open');
    document.getElementById('editRoleName').focus();
  });
}

function closePanel(){
  document.getElementById('createPanel').classList.remove('open');
}

function saveRole(){
  var name = document.getElementById('editRoleName').value.trim();
  var fb = document.getElementById('panelFeedback');
  if(!name){
    fb.style.display = 'block';
    fb.style.background = '#fceef0';
    fb.style.color = 'var(--red)';
    fb.textContent = '角色名称不能为空';
    return;
  }
  var payload = { name: name };
  var method = editingRoleId ? 'PUT' : 'POST';
  var urlPath = editingRoleId ? apiBase()+'/api/roles/'+editingRoleId : apiBase()+'/api/roles';
  apiFetch(urlPath, {
    method: method,
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(payload)
  }).then(function(r){
    return r.json().then(function(e){
      if(r.ok){
        fb.style.display = 'block';
        fb.style.background = 'var(--green-light)';
        fb.style.color = 'var(--green)';
        fb.textContent = '保存成功';
        setTimeout(function(){
          closePanel();
          loadRoles();
        }, 800);
      } else {
        fb.style.display = 'block';
        fb.style.background = '#fceef0';
        fb.style.color = 'var(--red)';
        fb.textContent = e.error || '保存失败';
      }
    });
  }).catch(function(e){
    fb.style.display = 'block';
    fb.style.background = '#fceef0';
    fb.style.color = 'var(--red)';
    fb.textContent = '网络错误: '+e.message;
  });
}

document.getElementById('searchInput').oninput = loadRoles;
loadRoles();
</script>
</body>
</html>
