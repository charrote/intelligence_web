  <div class="panel-body" id="panelBody"></div>
  <div class="panel-foot" id="panelFoot"></div>
</div>
<div class="panel-overlay" onclick="closePanel()"></div>
<script>
// Global state for domain configuration (shared by init.js loadDomainConfig)
var domainConfig = null;
var statusMap = {};

// Holds the port the user wants to be on (set before loadEnabledDomains runs)
var currentDomainPort = 8766;

function onDomainSwitch(port) {
  localStorage.setItem('domainPort', port);
  window.location.reload();
}

function loadEnabledDomains() {
  // System APIs (domains list) are always on the research container
  // Use currentDomainPort (set in window.load handler) instead of sel.value,
  // because sel.innerHTML = '' below clears all options and invalidates sel.value.
  var targetPort = parseInt(currentDomainPort) || 8766;
  apiFetch(systemApiBase() + '/api/system/domains/enabled')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var sel = document.getElementById('domainSwitcher');
      if (!sel) return;
      var domains = data.domains || [];
      sel.innerHTML = '';
      domains.forEach(function(d) {
        var opt = document.createElement('option');
        opt.value = d.port;
        opt.textContent = d.name;
        sel.appendChild(opt);
      });
      if (domains.length === 0) return;
      if (targetPort && domains.some(function(d) { return d.port === targetPort; })) {
        sel.value = targetPort;
      } else if (targetPort && !domains.some(function(d) { return d.port === targetPort; })) {
        sel.value = domains[0].port;
        localStorage.setItem('domainPort', domains[0].port);
      }
    })
    .catch(function(err) {
      console.error('[domainSwitcher] Failed to load enabled domains:', err);
    });
}

var currentIntel = null;
function closePanel(){document.getElementById('detailPanel').classList.remove('open');currentIntel=null;}
function openPanel(){document.getElementById('detailPanel').classList.add('open');}

window.addEventListener('load', function() {
  if (!checkAuth()) return;
  var port = getDomainPort ? getDomainPort() : 8766;
  currentDomainPort = port;  // save before calling loadEnabledDomains
  var sel = document.getElementById('domainSwitcher');
  if (sel) sel.value = port;
  loadEnabledDomains();
  loadDomainConfig().then(function() {
    updateAvatar();
    initTabs();
  }).catch(function(e) {
    updateAvatar();
    initTabs();
  });
});
</script>
