<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>目标类型管理</title>
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/sidebar.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
<script src="js/dom.js"></script>
<script src="js/auth.js"></script>
<script src="js/init.js"></script>
<script src="js/tabs.js"></script>
<style>
.table-wrapper{overflow-x:auto;background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-md);box-shadow:var(--shadow-sm)}
.table-wrapper table{border:none;background:transparent}
.table-wrapper th{border-bottom:1px solid var(--gray-200)}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.status-dot.on{background:var(--green)}
.status-dot.off{background:var(--gray-400)}
/* 图标按钮 */
.btn-icon{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border:none;border-radius:var(--radius);background:transparent;color:var(--gray-500);cursor:pointer;transition:all 0.12s;padding:0}
.btn-icon:hover{background:var(--gray-100);color:var(--gray-700)}
.btn-icon.btn-success:hover{background:var(--green-light);color:var(--green)}
.btn-icon.btn-warning:hover{background:#fef7e6;color:#b8862d}
.btn-icon.btn-danger:hover{background:var(--red-light);color:var(--red)}
/* 操作列固定 */
.action-cell{position:sticky;right:0;background:#fff;z-index:1;min-width:90px;text-align:right;padding-right:12px!important}
.action-cell td:last-child{border-left:1px solid var(--gray-200)}
.action-btns{display:flex;gap:4px;justify-content:flex-end;align-items:center}
.panel-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.15);z-index:200}
.panel{display:none;position:fixed;top:0;right:0;width:600px;max-width:94vw;height:100vh;background:#fff;box-shadow:var(--shadow-lg);z-index:201;flex-direction:column;overflow:hidden}
.panel.open{display:flex}.panel.open+.panel-overlay{display:block}
.panel-head{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--gray-200);flex-shrink:0}
.panel-head h2{font-size:15px;font-weight:600;color:var(--gray-800);flex:1;line-height:1.4;padding-right:8px}
.panel-close{width:28px;height:28px;border:none;border-radius:var(--radius);background:var(--gray-100);color:var(--gray-500);cursor:pointer;display:flex;align-items:center;justify-content:center}
.panel-close:hover{background:var(--gray-200);color:var(--gray-700)}
.panel-body{padding:20px;overflow-y:auto;flex:1}
.panel-foot{padding:12px 20px;border-top:1px solid var(--gray-200);display:flex;gap:6px;flex-shrink:0}
.panel-foot .btn{padding:7px 14px;border:none;border-radius:var(--radius);font-size:12px;font-weight:500;cursor:pointer;transition:all 0.12s}
.panel-foot .btn-primary{background:var(--accent);color:#fff}
.panel-foot .btn-primary:hover{background:#2f3f70}
.panel-foot .btn-ghost{background:var(--gray-100);color:var(--gray-600)}
.panel-foot .btn-ghost:hover{background:var(--gray-200)}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--gray-600);margin-bottom:4px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 12px;border:1px solid var(--gray-200);border-radius:var(--radius);font-size:13px;color:var(--gray-800);background:#fff}
.form-group textarea{resize:vertical;min-height:60px}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent);outline:none}
.form-row{display:flex;gap:12px}
.form-row .form-group{flex:1}
.empty{padding:40px;text-align:center;color:var(--gray-400);font-size:13px}
.color-swatch{width:24px;height:24px;border-radius:4px;display:inline-block;border:1px solid var(--gray-200)}
@keyframes fadeIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.panel.open{animation:fadeIn 0.2s ease-out}
</style>
</head>
<body>
<main class="main">
  <h1>目标类型管理</h1>
  <p class="sub">管理采集项目的目标类型分类</p>
  <div class="toolbar">
    <span class="spacer"></span>
    <button class="btn btn-primary" onclick="openCreate()">+ 新增类型</button>
  </div>
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th style="width:60px">排序</th>
          <th>类型名称</th>
          <th>标识符</th>
          <th>描述</th>
          <th>颜色</th>
          <th>状态</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</main>

<!-- Create/Edit Panel -->
<div class="panel" id="panel">
  <div class="panel-head"><h2 id="panelTitle">新增目标类型</h2><button class="panel-close" onclick="closePanel()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
  <div class="panel-body">
    <div class="form-row">
      <div class="form-group">
        <label>标识符 (slug) *</label>
        <input type="text" id="ttSlug" placeholder="如：product, technology">
      </div>
      <div class="form-group">
        <label>显示名称 *</label>
        <input type="text" id="ttLabel" placeholder="如：产品、技术">
      </div>
    </div>
    <div class="form-group">
      <label>描述</label>
      <textarea id="ttDesc" placeholder="类型描述..." rows="2"></textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>颜色</label>
        <input type="color" id="ttColor" value="#3b4f8c" style="height:40px">
      </div>
      <div class="form-group">
        <label>排序</label>
        <input type="number" id="ttSort" value="0" min="0">
      </div>
    </div>
    <div class="form-group">
      <label>
        <input type="checkbox" id="ttEnabled" checked> 启用
      </label>
    </div>
    <div id="panelFeedback" style="display:none;padding:10px;border-radius:var(--radius);font-size:13px;margin-top:8px"></div>
  </div>
  <div class="panel-foot">
    <button class="btn btn-primary" onclick="saveTargetType()">保存</button>
    <button class="btn btn-ghost" onclick="closePanel()">取消</button>
  </div>
</div>
<div class="panel-overlay" id="overlay" onclick="closePanel()"></div>

<script>
var targetTypes = [];
var editingId = null;

async function init() {
  try {
    var r = await apiFetch(APP_API_BASE + '/api/target_types?enabled=true');
    targetTypes = await r.json();
    renderTable();
  } catch(e) {
    document.getElementById('tableBody').innerHTML = '<tr><td colspan="7" class="empty">加载失败</td></tr>';
  }
}

function renderTable() {
  var html = '';
  if (targetTypes.length === 0) {
    html = '<tr><td colspan="7" class="empty">暂无目标类型</td></tr>';
  } else {
    targetTypes.forEach(function(tt) {
      html += '<tr>'
        + '<td style="color:var(--gray-400);font-size:12px">' + tt.sort_order + '</td>'
        + '<td><strong>' + escapeHtml(tt.label) + '</strong></td>'
        + '<td><code style="background:var(--gray-100);padding:2px 6px;border-radius:3px;font-size:12px">' + escapeHtml(tt.slug) + '</code></td>'
        + '<td style="color:var(--gray-600);font-size:13px">' + escapeHtml(tt.description || '-') + '</td>'
        + '<td><span class="color-swatch" style="background:' + (tt.color || '#3b4f8c') + '"></span></td>'
        + '<td><span class="status-dot ' + (tt.enabled ? 'on' : 'off') + '"></span>' + (tt.enabled ? '启用' : '停用') + '</td>'
        + '<td class="action-cell action-btns">'
          + '<button class="btn-icon" onclick="editTargetType(' + tt.id + ')" title="编辑"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>'
          + '<button class="btn-icon ' + (tt.enabled ? 'btn-warning' : 'btn-success') + '" onclick="toggleEnabled(' + tt.id + ', ' + (tt.enabled ? 'false' : 'true') + ')" title="' + (tt.enabled ? '停用' : '启用') + '">'
            + (tt.enabled 
              ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg>'
              : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="20 6 9 17 4 12"/></svg>')
          + '</button>'
          + '<button class="btn-icon btn-danger" onclick="deleteTargetType(' + tt.id + ')" title="删除"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>'
        + '</td>'
        + '</tr>';
    });
  }
  document.getElementById('tableBody').innerHTML = html;
}

function openCreate() {
  editingId = null;
  document.getElementById('panelTitle').textContent = '新增目标类型';
  document.getElementById('ttSlug').value = '';
  document.getElementById('ttLabel').value = '';
  document.getElementById('ttDesc').value = '';
  document.getElementById('ttColor').value = '#3b4f8c';
  document.getElementById('ttSort').value = '0';
  document.getElementById('ttEnabled').checked = true;
  document.getElementById('panelFeedback').style.display = 'none';
  document.getElementById('panel').classList.add('open');
  document.getElementById('ttSlug').focus();
}

function editTargetType(id) {
  var tt = targetTypes.find(function(t) { return t.id === id; });
  if (!tt) return;
  editingId = id;
  document.getElementById('panelTitle').textContent = '编辑目标类型';
  document.getElementById('ttSlug').value = tt.slug;
  document.getElementById('ttLabel').value = tt.label;
  document.getElementById('ttDesc').value = tt.description || '';
  document.getElementById('ttColor').value = tt.color || '#3b4f8c';
  document.getElementById('ttSort').value = tt.sort_order || 0;
  document.getElementById('ttEnabled').checked = !!tt.enabled;
  document.getElementById('panelFeedback').style.display = 'none';
  document.getElementById('panel').classList.add('open');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
}

async function saveTargetType() {
  var slug = document.getElementById('ttSlug').value.trim();
  var label = document.getElementById('ttLabel').value.trim();
  var desc = document.getElementById('ttDesc').value.trim();
  var color = document.getElementById('ttColor').value;
  var sort = parseInt(document.getElementById('ttSort').value) || 0;
  var enabled = document.getElementById('ttEnabled').checked;
  var fb = document.getElementById('panelFeedback');

  if (!slug || !label) {
    fb.style.display = 'block';
    fb.style.background = '#fceef0';
    fb.style.color = 'var(--red)';
    fb.textContent = '标识符和名称为必填项';
    return;
  }

  var payload = { slug: slug, label: label, description: desc, color: color, sort_order: sort, enabled: enabled };

  var method = editingId ? 'PUT' : 'POST';
  var urlPath = editingId ? APP_API_BASE + '/api/target_types/' + editingId : APP_API_BASE + '/api/target_types';
  try {
    var r = await apiFetch(urlPath, {
      method: method,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (r.ok) {
      closePanel();
      init();
    } else {
      var data;
      try { data = await r.json(); } catch(e) { data = {}; }
      fb.style.display = 'block';
      fb.style.background = '#fceef0';
      fb.style.color = 'var(--red)';
      fb.textContent = data.error || '保存失败 (HTTP ' + r.status + ')';
    }
  } catch(e) {
    fb.style.display = 'block';
    fb.style.background = '#fceef0';
    fb.style.color = 'var(--red)';
    fb.textContent = '请求失败：' + (e.message || '保存失败');
  }
}

async function toggleEnabled(id, enabled) {
  try {
    var r = await apiFetch(APP_API_BASE + '/api/target_types/' + id + '/toggle', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ enabled: enabled })
    });
    if (r.ok) init();
  } catch(e) { alert('操作失败'); }
}

async function deleteTargetType(id) {
  if (!confirm('确定删除此目标类型？')) return;
  try {
    var r = await apiFetch(APP_API_BASE + '/api/target_types/' + id, { method: 'DELETE' });
    if (r.ok) init();
  } catch(e) { alert('删除失败'); }
}

init();
</script>
</body>
</html>
