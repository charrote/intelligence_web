<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Domain Controller Test</title>
  <script src="js/dom.js"></script>
  <script src="js/auth.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .domain-card { padding: 15px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; }
    .status-on { color: green; }
    .status-off { color: red; }
  </style>
</head>
<body>
  <h1>Domain Controller Test</h1>
  <div id="result"></div>
  <script>
    async function test() {
      try {
        // Test 1: List domains
        const r1 = await fetch(apiBase() + '/api/system/domains', {
          headers: { 'Authorization': 'Bearer ' + getToken() }
        });
        const data1 = await r1.json();
        document.getElementById('result').innerHTML = '<h2>GET /api/system/domains</h2><pre>' + JSON.stringify(data1, null, 2) + '</pre>';
        
        // Test 2: Toggle domain
        const r2 = await fetch(apiBase() + '/api/system/domains/8767/toggle', {
          method: 'PUT',
          headers: { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json' },
          body: JSON.stringify({ enabled: false })
        });
        const data2 = await r2.json();
        document.getElementById('result').innerHTML += '<h2>PUT /api/system/domains/8767/toggle</h2><pre>' + JSON.stringify(data2, null, 2) + '</pre>';
        
        // Test 3: List enabled domains
        const r3 = await fetch(apiBase() + '/api/system/domains/enabled', {
          headers: { 'Authorization': 'Bearer ' + getToken() }
        });
        const data3 = await r3.json();
        document.getElementById('result').innerHTML += '<h2>GET /api/system/domains/enabled</h2><pre>' + JSON.stringify(data3, null, 2) + '</pre>';
        
        // Test 4: Toggle back
        const r4 = await fetch(apiBase() + '/api/system/domains/8767/toggle', {
          method: 'PUT',
          headers: { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json' },
          body: JSON.stringify({ enabled: true })
        });
        const data4 = await r4.json();
        document.getElementById('result').innerHTML += '<h2>PUT /api/system/domains/8767/toggle (restore)</h2><pre>' + JSON.stringify(data4, null, 2) + '</pre>';
        
      } catch(e) {
        document.getElementById('result').innerHTML = '<h2>Error</h2><pre>' + e.message + '</pre>';
      }
    }
    test();
  </script>
</body>
</html>
